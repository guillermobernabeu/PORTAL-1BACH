<header><p style="margin:0 0 6px"><a href="../" class="back vback1">← Volver</a></p><h1><small>Inglés · Global del 19 de noviembre</small>Global de Inglés</h1></header>

<script>
// ---------- Juegos del global de Inglés ----------
const $ = (s) => document.querySelector(s), H = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const azar = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RACHA = 2, KEY = "global_ingles_v1";

// --- material ---
const W = (window.SEED || []).filter(w => w.oficial);
const WEATHER = W.filter(w => w.bloque === "Weather");
const VOCAB = W.filter(w => w.bloque === "Textos" || w.bloque === "Weather");
const sinTo = (t) => String(t).replace(/^to\s+/i, "");
const enOk = (w) => [w.en, sinTo(w.en), ...w.en.split("/"), ...(w.ok || [])].map(s => s.trim()).filter(Boolean);
const esOk = (w) => w.es.split(/[,/]/).map(s => s.replace(/\(.*?\)/g, "").trim()).filter(Boolean).concat([w.es.replace(/\(.*?\)/g, "").trim()]);

// --- corrección ---
const CONTR = [[/\bdidnt\b/g, "did not"], [/\bdoesnt\b/g, "does not"], [/\bdont\b/g, "do not"], [/\bwasnt\b/g, "was not"], [/\bwerent\b/g, "were not"], [/\bwhats\b/g, "what is"], [/\bwhos\b/g, "who is"], [/\bwheres\b/g, "where is"], [/\bhows\b/g, "how is"], [/\bwhom\b/g, "who"], [/\bisnt\b/g, "is not"], [/\barent\b/g, "are not"], [/\bwont\b/g, "will not"], [/\bhasnt\b/g, "has not"], [/\bhavent\b/g, "have not"], [/\bhadnt\b/g, "had not"], [/\bcant\b/g, "cannot"], [/\bcan not\b/g, "cannot"], [/\bshouldnt\b/g, "should not"], [/\bmustnt\b/g, "must not"]];
function nrm(t) { let s = norm(t); for (const [r, v] of CONTR) s = s.replace(r, v); return s; }
// 2 bien · 1 casi (ortografía) · 0 mal. estricto: gramática (sin "casi")
function corr(resp, oks, estricto) {
  const r = nrm(resp); if (!r) return 0; const ok = oks.map(nrm);
  if (ok.some(v => v === r || sinArt(v) === sinArt(r))) return 2;
  if (estricto) return 0;
  const tol = (v) => v.length >= 12 ? 2 : v.length >= 5 ? 1 : 0;
  return ok.some(v => lev(sinArt(v), sinArt(r)) <= tol(sinArt(v))) ? 1 : 0;
}

// --- juegos: cada uno genera preguntas {id, juego, tag, ask, html, oks, sol, tipo:"esc"|"opc", opts?, estricto, propias} ---
const JUEGOS = {
  def: { app: "def", titulo: "Definitions", items: () => WEATHER, nota: "Weather: lee la definición y escribe la palabra, o elige la definición correcta de una palabra.",
    q: (w) => Math.random() < 0.6
      ? { tag: "Definition → word", ask: "¿Qué palabra es?", html: H(w.def), oks: enOk(w), sol: w.en, tipo: "esc" }
      : { tag: "Word → definition", ask: "Elige su definición", html: H(w.en), tipo: "opc", opts: azar([w, ...azar(WEATHER.filter(x => x.id !== w.id)).slice(0, 3)]).map(x => ({ t: x.def, ok: x.id === w.id })), sol: w.def } },
  trad: { app: "trad", titulo: "Translate", items: () => VOCAB, nota: "Vocabulario de los textos y del tiempo, en los dos sentidos.",
    q: (w) => Math.random() < 0.5
      ? { tag: "Español → English", ask: "Tradúcelo al inglés", html: H(w.es), oks: enOk(w), sol: w.en, tipo: "esc" }
      : { tag: "English → Español", ask: "Tradúcelo al español", html: H(w.en), oks: esOk(w), sol: w.es, tipo: "esc", propias: true } },
  gi: { app: "gi", titulo: "Gerund & infinitive", items: () => GI, racha: 1, nota: "Text 3: 300 ejercicios. Siempre salen nuevos; los que fallas, en «Repasar falladas». Cada acierto cuenta.",
    q: (g) => g.t === "gap"
      ? { tag: "Gerund or infinitive", ask: `¿-ing o to? Usa el verbo <b>${H(g.v)}</b>`, html: H(g.f).replace("___", '<span class="hueco">_____</span>'), oks: g.ok, sol: g.ok[0], tipo: "esc", estricto: true }
      : g.t === "es"
        ? { tag: "Español → English", ask: "Tradúcelo al inglés", html: H(g.f), oks: g.ok, sol: g.ok[0], tipo: "esc", frase: true, propias: true }
        : { tag: "English → Español", ask: "Tradúcelo al español", html: H(g.f), oks: g.ok, sol: g.ok[0], tipo: "esc", frase: true, propias: true } },
  past: { app: "past", titulo: "Passive voice", items: () => PASIVA, nota: "Transform into the passive voice: afirmativas, negativas y preguntas en todos los tiempos, como en la ficha de clase (que sale primero).",
    q: (p) => ({ tag: "Transform into the passive voice", ask: "Pásala a pasiva", html: H(p.f), oks: p.ok, sol: p.ok[0], tipo: "esc", estricto: true, frase: true, propias: true }) },
  preg: { app: "preg", titulo: "Make questions", items: () => PREGS, racha: 1, nota: "Escribe la pregunta cuya respuesta es la parte subrayada. Siempre salen frases nuevas; las falladas, en «Repasar falladas».",
    q: (p) => ({ tag: "Make questions", ask: "Haz la pregunta: la respuesta es lo <u>subrayado</u>", html: H(p.f).replace(/\[(.+?)\]/, "<u>$1</u>"), oks: p.ok, sol: p.ok[0], tipo: "esc", estricto: true, frase: true, propias: true }) },
  idioms: { app: "idioms", titulo: "Idioms", items: () => IDIOMS, externo: true,
    q: (i) => Math.random() < 0.5
      ? { tag: "Idiom → español", ask: "¿Qué significa?", html: H(i.en), oks: [...i.esOk, ...i.es.split("/")], sol: i.es, tipo: "esc", propias: true, dir: "en" }
      : { tag: "Español → idiom", ask: "Escribe el idiom en inglés", html: H(i.es), oks: [i.en, ...i.enOk], sol: i.en, tipo: "esc", dir: "es" } },
};
const MEZCLA = { def: 4, trad: 2, gi: 2, past: 4, preg: 4, idioms: 4 };

// --- progreso ---
function leer(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } }
const S = leer(KEY, {}); for (const k of ["def", "trad", "gi", "past", "preg"]) S[k] = S[k] || {};
const ID = leer("idioms_v1", { s: {} }); ID.s = ID.s || {};
function guardar() { try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem("idioms_v1", JSON.stringify(ID)); } catch (e) {} }
const stDe = (j, id, dir) => { if (j === "idioms") { const x = ID.s[id] = ID.s[id] || {}; return x[dir] = x[dir] || { a: 0, f: 0, r: 0 }; } return S[j][id] = S[j][id] || { a: 0, f: 0, r: 0 }; };
const rachaDe = (j) => JUEGOS[j].racha || RACHA;
const dom = (j, id) => j === "idioms" ? ["en", "es"].every(d => ((ID.s[id] || {})[d] || {}).r >= RACHA) : ((S[j][id] || {}).r || 0) >= rachaDe(j);
const nDom = (j) => JUEGOS[j].items().filter(x => dom(j, x.id)).length;
const total = (j) => JUEGOS[j].items().length;
const enPractica = (j) => JUEGOS[j].items().filter(x => !dom(j, x.id) && (j === "idioms" ? Object.keys(ID.s[x.id] || {}).length : S[j][x.id])).length;
const pts = (j) => Math.round(nDom(j) / total(j) * 100);

// --- rondas ---
let tab = "def", R = null;
function prio(j, x) { const s = j === "idioms" ? { r: Math.min(...["en", "es"].map(d => ((ID.s[x.id] || {})[d] || {}).r || 0)), f: 0 } : (S[j][x.id] || { r: 0, f: 0, a: 0 }); return (s.r >= RACHA ? 0 : 10) + (s.f || 0) * 2 - s.r * 3 + Math.random() * 5; }
// Make questions y Gerund & infinitive: siempre salen nuevas; las falladas solo si eliges "Repasar falladas". Las acertadas quedan hechas.
const modoRep = { preg: "nuevas", gi: "nuevas" };
let modoGI = "mix";
const itemsDe = (j) => j === "gi" && tab === "gi" && modoGI !== "mix" ? GI.filter(x => x.t === modoGI) : JUEGOS[j].items();
const falladas = (j) => itemsDe(j).filter(x => { const s = S[j][x.id]; return s && s.f > 0 && !(s.r > 0); });
function elegir(j, n) {
  if (j === "preg" || j === "gi") {
    const I = itemsDe(j), vis = (x) => S[j][x.id];
    const L = modoRep[j] === "falladas" && tab === j ? azar(falladas(j))
      : [...azar(I.filter(x => x.clase && !vis(x))), ...azar(I.filter(x => !x.clase && !vis(x))), ...azar(I.filter(x => vis(x) && !dom(j, x.id))), ...azar(I.filter(x => dom(j, x.id)))];
    return L.slice(0, n).map(x => ({ j, x, ...JUEGOS[j].q(x) }));
  }
  return JUEGOS[j].items().map(x => [x, prio(j, x) + (x.clase && !S[j][x.id] ? 4 : 0)]).sort((a, b) => b[1] - a[1]).slice(0, n).map(([x]) => ({ j, x, ...JUEGOS[j].q(x) })); }
function nuevaRonda() {
  const qs = tab === "examen" ? azar(Object.entries(MEZCLA).flatMap(([j, n]) => elegir(j, n))) : azar(elegir(tab, 10));
  R = { qs, n: 0, bien: 0, d0: Object.fromEntries(Object.keys(JUEGOS).map(j => [j, nDom(j)])), resp: null };
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab || b.dataset.tab === "trad" && tab === "gi")));
  if (!R) nuevaRonda();
  pintarDominio(); $("#main").innerHTML = htmlJuego();
  const i = $("#main .inp input"); if (i && !R.resp) i.focus({ preventScroll: true });
}
function pintarDominio() {
  if (tab === "examen") {
    const js = ["def", "trad", "gi", "past", "preg", "idioms"], t = js.reduce((s, j) => s + pts(j), 0);
    $("#dominio").innerHTML = `<div class="t">Mezcla de todo lo que entra: ${js.map(j => `${JUEGOS[j].titulo} <b>${pts(j)}%</b>`).join(" · ")}</div><div class="pts-v"><b>${t}</b><span>puntos</span></div><div class="bar"><i style="width:${t / js.length}%"></i></div>`;
    return;
  }
  const d = nDom(tab), T = total(tab);
  $("#dominio").innerHTML = `<div class="t"><b>${d}</b> de ${T} dominados · ${enPractica(tab)} en práctica<br><span style="font-size:12.5px">${H(JUEGOS[tab].nota)}</span></div><div class="pts-v"><b>${pts(tab)}</b><span>puntos</span></div><div class="bar"><i style="width:${d / T * 100}%"></i></div>`;
}
let teoGI = false;
const _V = (l) => `<ol class="vl">${l.map(([v, t]) => `<li><b>${v}</b><span>${t}</span></li>`).join("")}</ol>`;
const TEORIA_GI = `<article class="teo">
<p class="teo-i">En inglés, cuando un verbo va seguido de otra acción, esa segunda acción va en <b>gerundio (-ing)</b> o en <b>infinitivo con to</b>. No se elige al azar: depende de dónde va y de qué verbo va delante.</p>

<section class="card teo-b ger"><h2>1 · Gerundio (-ing)</h2>
<h3>① Como sujeto de la oración</h3><p>Cuando el verbo hace de sustantivo (en español suele ir en infinitivo).</p>

<h3>② Después de una preposición</h3><p>for, of, about, in, at, without, before, after… + <b>-ing</b>, siempre.</p>
<p class="ej">Thanks for <b>coming</b>. <span>Gracias por venir.</span></p><p class="ej">She left without <b>saying</b> goodbye.</p>

<section class="card teo-b inf"><h2>2 · Infinitivo con to</h2>

<p class="ej">Nice <b>to meet</b> you. · Pleased <b>to meet</b> you. · I am very happy <b>to come</b> here.</p>
<h3>② Para expresar finalidad («para»)</h3><p>En inglés «para + verbo» es <b>to + verbo</b>. Nunca <s>for + -ing</s>.</p>

<section class="card teo-b cam"><h2>3 · Cambian de significado</h2><p>Estos tres verbos llevan las dos formas, pero no significan lo mismo.</p>
<div class="par"><h3>stop</h3>
<p class="ej">I stopped <b>to call</b> you. <span>Paré <b>para</b> llamarte.</span></p>
<p class="ej">I stopped <b>calling</b> you. <span><b>Dejé de</b> llamarte.</span></p>
<p class="ej">Yesterday I stopped <b>to smoke</b> at the station. <span>Paré para fumar.</span></p>
<p class="ej">Yesterday I stopped <b>smoking</b> forever. <span>Dejé de fumar.</span></p></div>
<div class="par"><h3>forget</h3>
<p class="ej">I forgot <b>to meet</b> him. <span><b>Se me olvidó</b> quedar con él (no lo hice).</span></p>
<p class="ej">I forgot <b>meeting</b> him. <span><b>Olvidé haberlo hecho</b> (sí quedé).</span></p></div>
<div class="par"><h3>remember</h3>
<p class="ej">She remembered <b>to visit</b> her grandmother. <span><b>Se acordó de</b> ir a verla.</span></p>
<p class="ej">She remembered <b>visiting</b> her grandmother. <span><b>Recordaba haberlo hecho.</b></span></p></div>
<div class="ojo"><b>💡 Truco:</b> con <b>to</b> la acción viene <b>después</b> (algo que hay que hacer); con <b>-ing</b> la acción ya <b>había pasado</b>.</div>
</section>
