<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal 1.º Bachillerato</title>
<link rel="stylesheet" href="shared/estilo.css">
<style>
.wrap{max-width:860px;margin:0 auto;padding:62px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(26px,6vw,36px);letter-spacing:-.02em}header h1 small{display:block;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:0}
.yo{display:flex;align-items:center;gap:10px;font-weight:600}
.yo button{font:600 13px system-ui;background:none;border:1px solid var(--rule);color:var(--ink2);border-radius:999px;padding:6px 10px;cursor:pointer}
#login{max-width:420px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
#login p{margin:0;color:var(--ink2)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pr{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;border-top:5px solid var(--c);transition:transform .15s}
.pr:hover{transform:translateY(-2px)}
.pr .as{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pr b{font-size:18px}.pr span.d{font-size:14px;color:var(--ink2)}
.nuevo{align-self:flex-start;font:700 11px system-ui;background:var(--red);color:#fff;border-radius:6px;padding:3px 7px}
.clase{display:flex;flex-direction:column;gap:6px}
.u{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:8px 12px}
.u .n{flex:1;font-weight:600}.u .e{font-size:13px;color:var(--ink2)}
.pt{width:10px;height:10px;border-radius:50%;background:#b8c0cb}.pt.on{background:#2fb35f}
.err{color:var(--ko);font-size:14px}
</style></head><body>
<span class="claude">Claude</span>
<div class="wrap">
<header><h1><small>Para estudiar juntos</small>Portal 1.º Bachillerato</h1><div class="yo" id="yo" hidden></div></header>
<section id="login" class="card" hidden>
 <p style="font-size:18px;color:var(--ink);font-weight:700">Entra una vez y tendrás acceso a todo</p>
 <p>Usa tu cuenta de Google. La sesión se queda guardada en este dispositivo.</p>
 <button class="btn google" id="gbtn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Entrar con Google</button>
 <p class="err" id="lerr"></p>
</section>
<main id="app" hidden>
 <h2>Proyectos</h2><div class="grid" id="proy"></div>
 <h2>La clase</h2><div class="clase" id="clase"><p class="u">Cargando…</p></div>
</main>
<p id="carga" style="color:var(--ink2)">Cargando…</p>
</div>
<script type="module">
import { entrar, salir, alCambiarSesion, alCambiarClase, conectado } from "./shared/fb.js";
import { PROYECTOS } from "./shared/proyectos.js";
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
// proyectos
for (const p of PROYECTOS) {
  const a = el("a", "pr"); a.href = p.url; a.style.setProperty("--c", p.color || "#2156c9");
  if (p.nuevo) a.append(el("span", "nuevo", "NUEVO"));
  a.append(el("span", "as", p.asignatura), el("b", null, p.titulo), el("span", "d", p.descripcion));
  $("#proy").append(a);
}
let quitarClase = null, yoUid = null;
$("#gbtn").onclick = () => entrar().catch(e => $("#lerr").textContent = "No se pudo entrar (" + e.code + ").");
alCambiarSesion(user => {
  $("#carga").hidden = true;
  if (!user) { $("#login").hidden = false; $("#app").hidden = true; $("#yo").hidden = true; if (quitarClase) quitarClase(); return; }
  yoUid = user.uid;
  $("#login").hidden = true; $("#app").hidden = false;
  const yo = $("#yo"); yo.hidden = false; yo.textContent = "";
  if (user.photoURL) { const i = el("img", "av"); i.src = user.photoURL; i.alt = ""; i.referrerPolicy = "no-referrer"; yo.append(i); }
  yo.append(el("span", null, user.displayName || "Tú"));
  const s = el("button", null, "Salir"); s.onclick = salir; yo.append(s);
  quitarClase = alCambiarClase(pintaClase);
});
function pintaClase(us) {
  const c = $("#clase"); c.textContent = "";
  const lista = Object.entries(us).sort((a, b) => (conectado(b[1]) - conectado(a[1])) || (a[1].nombre || "").localeCompare(b[1].nombre || ""));
  const n = lista.filter(([, u]) => conectado(u)).length;
  c.append(el("p", "e", n + " conectado" + (n === 1 ? "" : "s") + " ahora · " + lista.length + " en total"));
  for (const [id, u] of lista) {
    const r = el("div", "u"); r.append(el("span", "pt" + (conectado(u) ? " on" : "")));
    if (u.foto) { const i = el("img", "av"); i.src = u.foto; i.alt = ""; i.referrerPolicy = "no-referrer"; r.append(i); }
    r.append(el("span", "n", (u.nombre || "Sin nombre") + (id === yoUid ? " (tú)" : "")));
    r.append(el("span", "e", conectado(u) ? "conectado" : "última vez " + new Date(u.visto || 0).toLocaleDateString("es-ES")));
    c.append(r);
  }
}
</script></body></html>
