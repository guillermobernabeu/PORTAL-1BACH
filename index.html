<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>1 BACH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: archivador de curso. Cabecera con el próximo examen, fila de separadores por asignatura,
   y una columna de trabajo: resumen (exámenes + asignaturas) o una asignatura por trimestres. */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --ink:#18213a; --ink-2:#4a5573; --rule:#dde3ef; --grid:#e9eef7;
  --accent:#2f5bd3; --accent-ink:#ffffff;
  --ok:#1f8a5b; --warn:#b7791f; --bad:#c2413a;
  --st-sin:#eef1f7; --st-visto:#fde9c4; --st-repasado:#d7e5ff; --st-dominado:#cdeedd;
  --st-sin-ink:#5b6582; --st-visto-ink:#7a4d05; --st-repasado-ink:#1d3f94; --st-dominado-ink:#11603d;
  --L:.54; --C:.14;
  --cal-paper:#fbfcfa; --cal-ink:#1d2333; --cal-ink-2:#5d667d; --cal-rule:#cdd6e8; --cal-rule-2:#e6ebf4; --cal-red:#d4332c; --cal-amber:#c27a12; --cal-grey:#8b93a6; --cal-hole:#c7cdd9;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --urge:#ff3b30; --urge-glow:rgba(255,59,48,.42);
  --sheetpaper:#ffffff; --sheetpaper-ink:#8a93a8; --scrim:rgba(9,12,22,.9); --on-scrim:#ffffff; --on-scrim-2:rgba(255,255,255,.72);
  --f-display:"Gabarito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#171e33; --ink:#e8ecf7; --ink-2:#a3adc8; --rule:#2a3350; --grid:#1b2340;
  --accent:#86a6ff; --accent-ink:#0f1424;
  --ok:#5fd39b; --warn:#f0b75a; --bad:#ff8a80;
  --st-sin:#222b45; --st-visto:#4a3514; --st-repasado:#203566; --st-dominado:#164331;
  --st-sin-ink:#a3adc8; --st-visto-ink:#ffd28a; --st-repasado-ink:#b9ccff; --st-dominado-ink:#9df0c6;
  --L:.76; --C:.12; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e8ecf7; --ink-2:#a3adc8; --rule:#2a3350; --grid:#1b2340;
  --accent:#86a6ff; --accent-ink:#0f1424;
  --ok:#5fd39b; --warn:#f0b75a; --bad:#ff8a80;
  --st-sin:#222b45; --st-visto:#4a3514; --st-repasado:#203566; --st-dominado:#164331;
  --st-sin-ink:#a3adc8; --st-visto-ink:#ffd28a; --st-repasado-ink:#b9ccff; --st-dominado-ink:#9df0c6;
  --L:.76; --C:.12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
/* fondo de pantalla: foto fija con un velo oscuro para que se lea lo que va encima */
.wallpaper{position:fixed;inset:0;z-index:0;pointer-events:none;background:#0b1020 url("fondo.jpg") 62% 30%/cover no-repeat}
.wallpaper::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,26,.25) 0%,rgba(8,12,26,.45) 45%,rgba(8,12,26,.7) 100%)}
.onphoto{color:#ffffff;text-shadow:0 1px 12px rgba(0,0,0,.55)}
.onphoto .eyebrow{color:rgba(255,255,255,.8)}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:700}

/* cabecera */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-size:clamp(40px,8vw,64px);font-weight:800;line-height:.9}
.brand h1 span{color:#9db8ff}
.next{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;
  display:flex;gap:14px;align-items:center;min-width:0;max-width:100%}
.next .days{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--accent)}
.next .days small{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.next .what{min-width:0}
.next .what b{display:block}
.next .what span{color:var(--ink-2);font-size:13px}

/* separadores */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);
  border-radius:8px 8px 0 0;border-bottom-width:3px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.tab .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tab[aria-current="page"]{border-bottom-color:var(--c);background:var(--sheet);box-shadow:0 2px 0 var(--c) inset}
.tab.home{--c:var(--accent)}

/* tarjetas */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sheet h2{font-size:20px}
.muted{color:var(--ink-2)}
.empty{color:var(--ink-2);font-size:14px;border:1px dashed var(--rule);border-radius:8px;padding:14px}

/* exámenes */
.exams{display:flex;flex-direction:column}
.exam{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.exam:first-child{border-top:0}
.exam .date{font-family:var(--f-mono);font-size:13px;color:var(--ink-2)}
.exam .date b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink)}
.exam .t{min-width:0}
.exam .t b{display:block}
.exam .t span{font-size:13px;color:var(--ink-2)}
.chip-asig{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--c)}
.chip-asig::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.count{font-family:var(--f-mono);font-size:13px;padding:3px 8px;border-radius:6px;background:var(--st-sin);color:var(--st-sin-ink);white-space:nowrap}
.count.soon{background:var(--st-visto);color:var(--st-visto-ink)}
.count.done{background:var(--st-dominado);color:var(--st-dominado-ink)}
details summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2)}

/* rejilla de asignaturas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subj{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c)}
.subj:hover{border-color:var(--c)}
.subj h3{font-size:17px}
.tri-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tri-bars div{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-2)}
.bar{height:6px;border-radius:3px;background:var(--st-sin);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.subj .meta{font-size:12px;color:var(--ink-2)}

/* vista asignatura */
.subj-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
.subj-head h2{font-size:clamp(26px,5vw,36px);color:var(--c)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--sheet)}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink-2);align-items:center}

.temas{display:flex;flex-direction:column}
.tema{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.tema:first-child{border-top:0}
.tema .body{min-width:0;display:flex;flex-direction:column;gap:6px}
.tema .body b{font-size:15px}
.tema .body p{margin:0;font-size:13px;color:var(--ink-2)}
.st{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-width:84px;
  background:var(--st-sin);color:var(--st-sin-ink);align-self:start}
.st[data-s="visto"]{background:var(--st-visto);color:var(--st-visto-ink)}
.st[data-s="repasado"]{background:var(--st-repasado);color:var(--st-repasado-ink)}
.st[data-s="dominado"]{background:var(--st-dominado);color:var(--st-dominado-ink)}
.st[disabled]{cursor:default}
.res{display:flex;flex-wrap:wrap;gap:6px}
.r{display:inline-flex;align-items:center;gap:6px;max-width:100%;text-decoration:none;font-size:13px;border:1px solid var(--rule);
  border-radius:6px;padding:3px 8px;background:var(--paper)}
.r:hover{border-color:var(--c)}
button.r{font:inherit;color:inherit;cursor:pointer}
.r{position:relative}
.r.hc{padding-left:10px;margin-top:6px}
.cb{position:absolute;top:-7px;left:-5px;z-index:2;font-family:var(--f-body);font-size:9px;font-weight:700;letter-spacing:.04em;line-height:1;
  color:#fff;background:#c2593a;border-radius:999px;padding:2px 6px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.paper .cb{top:6px;left:6px;font-size:10px;padding:3px 7px}
.r .k{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--c);font-weight:500}
.r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.fallos{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.note{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);
  padding:8px 14px;border-radius:8px;font-size:14px;z-index:20}

@media (max-width:520px){
  .exam{grid-template-columns:60px 1fr;}
  .exam .count{grid-column:2;justify-self:start}
  .tema{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

/* exámenes como documentos */
.exsub{display:flex;flex-direction:column;gap:10px}
.exsub h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 16px}
.doc{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.doc[disabled]{cursor:default}
.paper{position:relative;isolation:isolate;display:block;aspect-ratio:1/1.414;background:var(--sheetpaper);border-radius:2px;
  box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 18px rgba(20,30,60,.18)}
.paper img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;border-radius:2px}
.paper.stack::before,.paper.stack::after{content:"";position:absolute;inset:0;background:var(--sheetpaper);border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:-1}
.paper.stack::before{transform:translate(7px,5px) rotate(2deg)}
.paper.stack::after{transform:translate(3px,2px) rotate(-1.2deg)}
.paper .blank{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;color:var(--sheetpaper-ink);font-size:12px}
.paper .pages{position:absolute;right:6px;bottom:6px;background:var(--scrim);color:var(--on-scrim);font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:4px}
.doc-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.doc-meta b{font-size:14px;line-height:1.3}
.doc-meta span{font-size:12px;color:var(--ink-2)}
.doc-meta .nota{color:var(--c);font-weight:700}
@media (prefers-reduced-motion:no-preference){.paper{transition:transform .15s ease}.doc:not([disabled]):hover .paper{transform:translateY(-3px)}}
.exam[data-exam]{cursor:pointer}
.exam[data-exam]:hover .t b{text-decoration:underline}
/* visor */
.viewer{position:fixed;inset:0;z-index:45;background:var(--scrim);color:var(--on-scrim);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vbar .vt{min-width:0;display:flex;flex-direction:column}
.vbar .vt b{font-family:var(--f-display);font-size:18px}
.vbar .vt span{font-size:13px;color:var(--on-scrim-2)}
.vbtns{display:flex;gap:8px;flex:none}
.vbtns button{border:1px solid var(--on-scrim-2);background:none;color:var(--on-scrim);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
.vpages{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:8px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vpages figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(100%,860px)}
.vpages img{width:100%;height:auto;background:var(--sheetpaper);border-radius:2px;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.vpages figcaption{font-family:var(--f-mono);font-size:12px;color:var(--on-scrim-2)}
.vpages.zoom{align-items:flex-start}
.vpages.zoom figure{width:max(200%,1400px)}
.vpages.zoom img{max-width:none}

/* ficha de examen */
.ficha-bg{position:fixed;inset:0;z-index:35;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ficha{position:relative;width:min(680px,100%);margin-top:4vh;background:var(--sheet);color:var(--ink);border-radius:14px;border-top:6px solid var(--c);
  padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ficha .cerrar{position:absolute;top:12px;right:12px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.ficha h2{font-size:24px;padding-right:40px}
.ficha .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--ink-2)}
.ficha .pill{font-family:var(--f-mono);font-size:13px;padding:3px 9px;border-radius:999px;background:var(--st-sin);color:var(--st-sin-ink)}
.ficha .pill.urge{background:var(--urge);color:#fff}
.ficha h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.indice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}
.indice > li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.indice > li::before{counter-increment:t;content:counter(t);grid-row:1/span 3;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c);line-height:1.1}
.indice b{font-size:15px}
.indice p{margin:0;font-size:13px;color:var(--ink-2)}
.indice ul{margin:2px 0 0;padding-left:18px;font-size:13px}
.indice .st{justify-self:start;margin-top:2px}
.acciones{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn-empezar{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:0;border-radius:999px;background:var(--cf);color:#fff;font-family:var(--f-display);font-weight:800;font-size:16px;padding:12px 22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn-sec{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.ficha details summary{font-size:13px}
.ficha textarea{width:100%;min-height:150px;font:12px/1.45 var(--f-mono);border:1px solid var(--rule);border-radius:8px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
.apts{display:flex;flex-direction:column;gap:8px;padding:4px 0 14px 88px}
.apts-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.apts .docs{grid-template-columns:repeat(auto-fill,minmax(110px,150px))}
.ficha .apts{padding:0}
@media (max-width:520px){.apts{padding-left:0}}
.exam[data-det],.ce[data-ir]{cursor:pointer}
.exam[data-det]:hover .t b,.ce[data-ir]:hover .info b{text-decoration:underline}
.ce[data-ir]{border-radius:10px}
.ce[data-ir]:focus-visible,.exam[data-det]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in oklab,var(--c) 22%,transparent)}100%{background:transparent}}

/* modo práctica */
.prac{display:flex;flex-direction:column;gap:16px}
.prac-head{background:var(--sheet);border:1px solid var(--rule);border-top:6px solid var(--c);border-radius:12px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.prac-head h2{font-size:clamp(22px,4vw,30px)}
.prac-head .formato{font-size:13px;color:var(--ink-2)}
.parte{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.parte > header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:baseline}
.parte h3{font-family:var(--f-display);font-size:19px;text-transform:none;letter-spacing:0;color:var(--ink)}
.parte h3 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-2);margin-left:6px}
.pq{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--rule)}
.pq:first-of-type{border-top:0}
.pq > b{font-size:15px}
.pq label{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;font-size:14px;background:var(--paper)}
.pq label input{margin-top:3px;accent-color:var(--c)}
.pq label.ok{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 12%,var(--sheet))}
.pq label.ko{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,var(--sheet))}
.pq .exp{font-size:13px;color:var(--ink-2)}
.score{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.prac textarea{width:100%;min-height:110px;font:inherit;font-size:14px;line-height:1.5;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--ink);resize:vertical}
.enun{white-space:pre-line;font-size:14.5px;line-height:1.55;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.fila-b{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-p{border:0;border-radius:999px;background:var(--cf);color:#fff;font-weight:800;font-size:14px;padding:9px 18px;cursor:pointer}
.btn-p[disabled]{opacity:.55;cursor:default}
.ref{white-space:pre-line;font-size:14px;line-height:1.55;border-left:3px solid var(--c);padding:8px 12px;background:var(--paper);border-radius:0 8px 8px 0}
.correc{display:flex;flex-direction:column;gap:6px;font-size:14px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:color-mix(in oklab,var(--c) 6%,var(--sheet))}
.correc .nota{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c)}
.correc ul{margin:0;padding-left:18px}
.chat{display:flex;flex-direction:column;gap:10px}
.msgs2{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg.yo{align-self:flex-end;background:var(--cf);color:#fff;border-bottom-right-radius:4px}
.msg.cl{align-self:flex-start;background:var(--paper);border:1px solid var(--rule);border-bottom-left-radius:4px}
.chat form{display:flex;gap:8px}
.chat input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink)}
.sin-claude{font-size:13px;color:var(--ink-2)}

/* vocabulario */
.vtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vtools input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.fchip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--sheet)}
.vlist{max-height:520px;overflow:auto;border:1px solid var(--rule);border-radius:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;padding:8px 12px;border-top:1px solid var(--rule)}
.vrow:first-child{border-top:0}
.vrow .en{font-weight:700}
.vrow .es{color:var(--ink)}
.vrow .ojo,.vrow .nv{grid-column:1/-1;font-size:12px}
.vrow .ojo{color:var(--warn)}
.vrow .nv{color:var(--ink-2)}
.tagc{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--c);margin-left:6px;font-weight:500}
.vlist.tapar .es{background:var(--st-sin);color:transparent;border-radius:4px;cursor:pointer;user-select:none}
.vlist.tapar .vrow.ver .es{background:none;color:var(--ink)}
.vlist.tapar .ojo{display:none}
.vlist.tapar .vrow.ver .ojo{display:block}
@media (max-width:520px){.vrow{grid-template-columns:1fr}}

/* colores por asignatura: --c para la interfaz, --cf relleno y tinta sobre papel (igual en los dos temas) */
[data-a]{--c:oklch(var(--L) var(--C) var(--h,260));--cf:oklch(.5 .14 var(--h,260))}
[data-a="filosofia"]{--h:295}
[data-a="lengua"]{--h:190}
[data-a="fyq"]{--h:222}
[data-a="mates"]{--h:258}
[data-a="economia"]{--h:155}
[data-a="ingles"]{--h:55}
[data-a="bio"]{--h:125}
[data-a="ef"]{--h:90}
[data-a="tic"]{--c:oklch(var(--L) .03 260);--cf:oklch(.42 .03 260)}
[data-a="global"]{--c:var(--accent);--cf:#2f5bd3}

/* pantalla de bienvenida */
.splash{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;color:#fff;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:transparent}
.splash .in{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:640px}
.splash .eyebrow{color:rgba(255,255,255,.78)}
.splash h1{font-size:clamp(72px,18vw,150px);font-weight:800;line-height:.85;letter-spacing:-.02em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.splash h1 span{color:#9db8ff}
.splash .hola{font-family:var(--f-display);font-size:clamp(22px,4.4vw,30px);font-weight:700;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.splash .sub{font-size:16px;color:rgba(255,255,255,.86);max-width:44ch;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.splash .sub b{color:#fff}
.entrar{margin-top:14px;border:0;border-radius:999px;background:#fff;color:#141a2e;font-family:var(--f-display);font-weight:800;font-size:18px;
  padding:14px 38px;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.entrar:focus-visible{outline:3px solid #9db8ff;outline-offset:3px}
.splash .tecla{font-size:13px;color:rgba(255,255,255,.7)}
.splash .tecla kbd{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:1px 7px;margin:0 2px}
.splash.out{opacity:0;pointer-events:none}
body.con-splash{overflow:hidden}
body.con-splash .wrap{visibility:hidden;opacity:0}
.wrap{transition:opacity .45s ease}
@media (prefers-reduced-motion:no-preference){.splash{transition:opacity .45s ease}.splash .in{animation:subir .7s ease both}.entrar{transition:transform .15s ease}.entrar:hover{transform:scale(1.04)}}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* portada: asignaturas en bloques */
.home{display:flex;flex-direction:column;gap:22px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{position:relative;border:0;border-radius:12px;background:var(--cf);color:#fff;text-align:left;cursor:pointer;
  padding:14px 14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 18px rgba(0,0,0,.25);overflow:hidden}
.tile::after{content:"";position:absolute;inset:auto -20% -60% 40%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent);pointer-events:none}
.tile b{font-family:var(--f-display);font-size:17px;line-height:1.15;text-wrap:balance}
.tile span{font-size:12px;opacity:.88}
.tile .tb{height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.tile .tb i{display:block;height:100%;background:#fff}
.tile:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tile.urge{z-index:1;transform:scale(1.045);box-shadow:0 0 0 2px var(--urge),0 0 22px 4px var(--urge-glow),0 6px 18px rgba(0,0,0,.25)}
.tile.urge span.cuando{font-weight:700;opacity:1}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s ease}.tile:hover{transform:translateY(-2px)}.tile.urge:hover{transform:scale(1.045) translateY(-2px)}}
@media (max-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:430px){.tiles{gap:8px}.tile{min-height:84px;padding:10px 10px 9px}.tile b{font-size:14px}.tile span{font-size:11px}}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}

/* calendario en hoja */
.agenda{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.agenda{grid-template-columns:1fr}.agenda .leyenda{order:-1}}
.cal{position:relative;background:var(--cal-paper);color:var(--cal-ink);border-radius:3px;padding:34px 22px 24px;
  box-shadow:0 1px 2px rgba(0,0,0,.18),0 14px 34px rgba(10,16,36,.35);
  background-image:linear-gradient(90deg,transparent 0,transparent 30px,rgba(212,51,44,.35) 30px,rgba(212,51,44,.35) 31px,transparent 31px)}
.cal .holes{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:22%;pointer-events:none}
.cal .holes i{width:12px;height:12px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.cal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;padding-left:20px;margin-bottom:14px}
.cal-head h2{font-family:var(--f-display);font-size:24px;color:var(--cal-ink)}
.cal-head .sub{font-size:13px;color:var(--cal-ink-2)}
.ctabs{display:inline-flex;gap:4px}
.ctabs button{border:1px solid var(--cal-rule);background:transparent;color:var(--cal-ink-2);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer}
.ctabs button[aria-pressed="true"]{background:var(--cal-ink);border-color:var(--cal-ink);color:var(--cal-paper)}
.mscroll{overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding-left:20px;scrollbar-width:thin;outline:none}
.mscroll:focus-visible{box-shadow:0 0 0 2px var(--cal-rule)}
.par{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 26px;align-content:start;scroll-snap-align:start;scroll-snap-stop:always;padding-bottom:6px}
@media (max-width:560px){.par{grid-template-columns:1fr}}
.calY{font-family:var(--f-body);font-weight:500;font-size:15px;color:var(--cal-ink-2)}
.mes h3{font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--cal-ink);
  border-bottom:2px solid var(--cal-ink);padding-bottom:4px;margin-bottom:6px;display:flex;justify-content:space-between}
.mes h3 span{color:var(--cal-ink-2);font-weight:500}
.dow,.dias{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow span{font-size:11px;font-weight:700;color:var(--cal-ink-2);text-align:center;padding:2px 0}
.dow span:nth-child(n+6){color:var(--cal-red)}
.dia{position:relative;min-height:46px;border-top:1px solid var(--cal-rule-2);border-left:1px solid var(--cal-rule-2);padding:3px 2px 2px;
  display:flex;flex-direction:column;align-items:center;gap:1px;font-variant-numeric:tabular-nums}
.dias .dia:nth-child(7n+1){border-left:0}
.dia .n{font-size:13px;line-height:1;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.dia.we .n{color:var(--cal-red);opacity:.75}
.dia.past .n{color:var(--cal-grey)}
.dia.vacio{border-top-color:transparent}
.dia.ex{cursor:pointer}
.dia.ex .n{border:2px solid var(--pen);border-radius:52% 46% 55% 44%/48% 55% 45% 52%;transform:rotate(-7deg);color:var(--cal-ink);font-weight:700}
.dia.ex.hecho .n{border-color:var(--cal-grey);color:var(--cal-grey)}
.dia.hoy .n{background:var(--cal-red);color:#fff;font-weight:700}
.mk{font-family:var(--f-hand);font-weight:700;font-size:13px;line-height:1;color:var(--pen);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dia.hecho .mk{color:var(--cal-grey);text-decoration:line-through}
.cal-key{display:flex;flex-wrap:wrap;gap:14px;padding-left:20px;margin-top:16px;font-size:12px;color:var(--cal-ink-2);align-items:center}
.cal-key i{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-3px;margin-right:5px}
.cal-key .k-hoy{background:var(--cal-red)}
.cal-key .k-ex{border:2px solid var(--cal-ink);border-radius:52% 46% 55% 44%}
.cal-key .k-hecho{border:2px solid var(--cal-grey)}

/* leyenda: cuenta atrás */
.leyenda{display:flex;flex-direction:column;gap:16px}
.cuenta{display:flex;flex-direction:column}
.ce{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.ce:first-child{border-top:0}
.ce .num{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:.9;text-align:center;color:var(--cal-grey)}
.ce .num small{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.ce.u1 .num{color:var(--bad)}
.ce.u2 .num{color:var(--warn)}
.ce .info{min-width:0;display:flex;flex-direction:column;gap:1px}
.ce .info b{font-size:14px;line-height:1.25}
.ce .info .m{font-size:12px;color:var(--ink-2)}
.ce.lejos .info b{color:var(--ink-2)}
.ce.urge{grid-template-columns:72px minmax(0,1fr);padding:14px 10px;margin:4px -4px;border:2px solid var(--urge);border-radius:12px;
  background:color-mix(in oklab,var(--urge) 7%,var(--sheet));box-shadow:0 0 18px 2px var(--urge-glow)}
.ce.urge + .ce{border-top-color:transparent}
.ce.urge .num{font-size:38px;color:var(--urge)}
.ce.urge .info b{font-size:16px}
.carga{display:flex;flex-direction:column;gap:8px}
.cg{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.cg .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg .bar2{height:10px;border-radius:5px;background:var(--st-sin);overflow:hidden}
.cg .bar2 i{display:block;height:100%;background:var(--c);border-radius:5px}
.cg .h{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.ritmo{font-size:12px;color:var(--ink-2)}
.ritmo b{color:var(--ink)}

.hero{border:1px solid var(--rule);border-radius:16px;padding:20px;background:color-mix(in oklab,var(--cf) 9%,var(--sheet));display:flex;flex-direction:column;gap:16px}
.hero.urge{border:2px solid var(--urge);box-shadow:0 0 22px 3px var(--urge-glow)}
.hero .h-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.hero h2{margin:2px 0 0;font-size:22px;line-height:1.2}
.hero .h-cd{text-align:right;display:flex;flex-direction:column;gap:2px}
.hero .h-cd small{font-size:12px;color:var(--ink-2)}
.hero .cdn{font-family:var(--f-mono);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}

.hero .h-pct{display:flex;align-items:center;gap:14px}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;min-width:2.3em}
.hero .barra{flex:1;height:14px;border-radius:7px;background:var(--st-sin);overflow:hidden}
.hero .barra i{display:block;height:100%;background:var(--cf);border-radius:7px;transition:width .3s}
.hero .desg{font-size:12px;color:var(--ink-2)}
.hero .chk{display:flex;flex-direction:column;gap:8px}
.hero .tk{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hero .tk>label,.hero .tk li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.hero .tk>label{font-weight:700;font-size:15px}
.hero .tk ul{margin:0;padding:0 0 0 30px;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px}
.hero input[type=checkbox]{width:20px;height:20px;accent-color:var(--cf);flex:none;margin:0;cursor:pointer}
.hero .tk.ok>label span{text-decoration:line-through;color:var(--ink-2)}
.hero .tk li.ok span{text-decoration:line-through;color:var(--ink-2)}
.hero .tk .pt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-weight:400}
/* portal: barra de amigos, perfil y ranking */
.claude-ov{position:fixed;top:10px;left:10px;z-index:70;font:600 11px/1 var(--f-body);padding:4px 10px;border:1.4px solid #d97757;color:#d97757;border-radius:999px;background:rgba(255,255,255,.92)}
.amibar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.amigos-btn{border:0;border-radius:999px;background:#fff;color:#141a2e;font-family:var(--f-display);font-weight:800;font-size:15px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.yo{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.45);background:rgba(10,14,28,.55);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;backdrop-filter:blur(6px)}
.yo .mispts{font-family:var(--f-mono);font-size:12px;background:#fff;color:#141a2e;border-radius:999px;padding:2px 8px}
.ava{border-radius:50%;object-fit:cover;flex:none;display:block}
.av0{display:grid;place-items:center;background:var(--st-repasado);color:var(--st-repasado-ink);font-family:var(--f-display);font-weight:800}
.vista{display:flex;flex-direction:column;gap:16px}
.ranking{display:flex;flex-direction:column;gap:8px}
.rk{display:grid;grid-template-columns:34px 42px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:10px 12px;background:var(--paper)}
.yo-fila{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent) inset}
.rk .pos{font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center}
.rk-n{min-width:0;display:flex;flex-direction:column;gap:2px}.rk-n>span{font-size:12px;color:var(--ink-2)}.rk-n>span.on{color:var(--ok);font-weight:700}
.rk-apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;margin-top:4px}

.pts{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--accent);text-align:right}.pts small{font-size:11px;margin-left:2px;color:var(--ink-2)}
.perfil .pf-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pf-foto{position:relative}
.pf-cam{position:absolute;right:-2px;bottom:-2px;width:38px;height:38px;border-radius:50%;border:2px solid var(--sheet);background:var(--accent);color:#fff;font-size:17px;cursor:pointer}
.pf-datos h2{font-size:clamp(24px,4vw,32px)}
.pf-big{display:flex;gap:26px;margin-top:8px}.pf-big span{display:flex;flex-direction:column}.pf-big b{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;color:var(--accent)}.pf-big small{font-size:12px;color:var(--ink-2)}
.pf-acc{display:flex;gap:10px;flex-wrap:wrap}
.pf-nom{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}.pf-nom div{display:flex;gap:8px}
.pf-nom input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.pf-apps{display:flex;flex-direction:column;gap:12px}

.pf-app>div:first-child{display:flex;flex-direction:column}.pf-app span{font-size:12px;color:var(--ink-2)}

}

[hidden]{display:none!important}

<script>
const ASIG=[
 {id:"filosofia",n:"Filosofía"},{id:"lengua",n:"Lengua y Literatura"},{id:"fyq",n:"Física y Química"},
 {id:"mates",n:"Matemáticas"},{id:"economia",n:"Economía"},{id:"ingles",n:"Inglés"},
 {id:"bio",n:"Biología y Geología"},{id:"ef",n:"Educación Física"},{id:"tic",n:"TIC"}];
const AN=Object.fromEntries(ASIG.map(a=>[a.id,a.n]));
const NOM={...AN,global:"Globales"};
const EST=[["sin","Sin ver"],["visto","Visto"],["repasado","Repasado"],["dominado","Dominado"]];
const ESTN=Object.fromEntries(EST), PESO={sin:0,visto:.34,repasado:.67,dominado:1};
const TIPO={chat:"Chat",app:"App",doc:"Doc",archivo:"Archivo",web:"Web"};
const S={ocultos:[],temas:[],recursos:[],examenes:[],fallos:[],vocab:[],practica:[],loaded:false,error:null,canWrite:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tri={}; try{tri=JSON.parse(localStorage.getItem("tri")||"{}")}catch(e){}

function hoy(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseF(f){if(!f)return null;const[y,m,d]=f.split("-").map(Number);return new Date(y,m-1,d)}
function dias(f){const d=parseF(f);return d?Math.round((d-hoy())/864e5):null}
// Cuándo se abre cada trimestre (aprox.: el 2.º tras la semana de globales; el 3.º a mediados de marzo)
const ABRE_TRI={2:new Date(2026,11,2),3:new Date(2027,2,15)};
const triAbierto=n=>!ABRE_TRI[n]||Date.now()>=ABRE_TRI[n].getTime();
function triActual(){return triAbierto(3)?3:triAbierto(2)?2:1}
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fechaCorta(f){const d=parseF(f);return d?{d:d.getDate(),m:MES[d.getMonth()]}:null}
function link(r){const x=link0(r);return S.canWrite?`<span class="rw">${x}<button class="rx-del" type="button" data-ocultar="${esc(r.id)}" title="Quitar de aquí" aria-label="Quitar ${esc(r.titulo)}">×</button></span>`:x}
function link0(r){const pg=(r.paginas||[]).filter(esDoc);
  if(pg.length)return `<button class="r ${r.claude?"hc":""}" data-doc="${esc(r.id)}" title="${esc(r.nota||r.titulo)}">${r.claude?'<span class="cb" title="Hecho por Bernabéu">Bernabéu</span>':""}<span class="k">${esc(r.cat||TIPO[r.tipo]||r.tipo)}</span><span class="n">${esc(r.titulo)}</span></button>`;
  if(r.examen)return `<button class="r ${r.claude?"hc":""}" data-exam="${esc(r.examen)}" title="${esc(r.nota||r.titulo)}">${r.claude?'<span class="cb" title="Hecho por Bernabéu">Bernabéu</span>':""}<span class="k">${esc(r.cat||"Examen")}</span><span class="n">${esc(r.titulo)}</span></button>`;
  const interno=/^[a-z0-9-]+\/$/.test(r.url||"");const safe=/^https:\/\//.test(r.url||"")||esDoc(r.url)||interno?r.url:null;
  const inner=`<span class="k">${esc(r.cat||TIPO[r.tipo]||r.tipo)}</span><span class="n">${esc(r.titulo)}</span>`;
  const cb=r.claude?'<span class="cb" title="Hecho por Bernabéu">Bernabéu</span>':"",hc=r.claude?" hc":"";
  return safe?`<a class="r${hc}" href="${esc(safe)}" ${interno?"":`target="_blank" rel="noopener"`} title="${esc(r.nota||r.titulo)}">${cb}${inner}</a>`:`<span class="r${hc}" title="${esc(r.nota||"")}">${cb}${inner}</span>`}
const esDoc=u=>/^docs\/[\w.-]+(\/[\w.-]+)*$/.test(u||"");
const hojas=e=>(e.paginas||[]).filter(esDoc);
function progreso(list){if(!list.length)return null;return list.reduce((s,t)=>s+pTema(t),0)/list.length}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2200)}

function route(){const h=location.hash.slice(1);return AN[h]||h==="amigos"||h==="perfil"||h==="chat"||/^practica-[a-z0-9]+$/.test(h)?h:"resumen"}


function limite(e){const d=parseF(e.fecha);return d?new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,23,59,59):null}
function fmtCd(ms){if(ms<=0)return "Tiempo terminado";const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,q=n=>String(n).padStart(2,"0");return (d?d+" d ":"")+`${q(h)}:${q(m)}:${q(x)}`}
function hechosDe(t){const n=(t.puntos||[]).length;if(t.estado==="dominado"&&!(t.hechos||[]).length)return [...Array(n).keys()];return (t.hechos||[]).filter(i=>i<n)}
function pTema(t){const n=(t.puntos||[]).length;return n?hechosDe(t).length/n:(PESO[t.estado]??0)}
function pPractica(e){const q=e.practica;if(!q)return null;const v=[q.test,q.redac].filter(x=>typeof x==="number");return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function pExamen(e){const ts=temasDe(e),a=ts.length?ts.reduce((s,t)=>s+pTema(t),0)/ts.length:null,b=pPractica(e);
  if(a==null&&b==null)return {tot:0,a,b};return {tot:a==null?b:b==null?a:a*.6+b*.4,a,b}}
function heroExamen(e){const L=limite(e),ms=L?L-new Date():null,pr=pExamen(e),ts=temasDe(e),pct=Math.round(pr.tot*100);
  const urge=ms!=null&&ms>0&&ms<5*864e5,f=fechaCorta(e.fecha),hayP=S.practica.some(x=>x.examen===e.id);
  const desg=[pr.a!=null?`Temas ${Math.round(pr.a*100)}%`:"",pr.b!=null?`Simulacro ${Math.round(pr.b*100)}%`:(hayP?"Simulacro: aún sin hacer":"")].filter(Boolean).join(" · ");
  const lista=ts.map(t=>{const n=(t.puntos||[]).length,h=hechosDe(t),ok=n?h.length===n:t.estado==="dominado";
    return `<div class="tk ${ok?"ok":""}"><label><input type="checkbox" data-ptema="${esc(t.id)}" ${ok?"checked":""} ${S.canWrite?"":"disabled"}><span>${esc(t.titulo)}</span>${n?`<span class="pt">${h.length}/${n}</span>`:""}</label>
      ${n?`<ul>${t.puntos.map((x,i)=>{const d=h.includes(i);return `<li class="${d?"ok":""}"><label><input type="checkbox" data-punto="${esc(t.id)}:${i}" ${d?"checked":""} ${S.canWrite?"":"disabled"}><span>${esc(x)}</span></label></li>`}).join("")}</ul>`:""}</div>`}).join("");
  return `<section class="hero ${urge?"urge":""}" data-a="${e.asig}"><div class="h-top"><div><div class="eyebrow">Próximo examen${f?` · ${f.d} ${f.m}`:""}</div><h2>${esc(e.titulo)}</h2>${e.alcance?`<div class="note">${esc(e.alcance)}</div>`:""}</div>
    ${L?`<div class="h-cd"><small>Tiempo de estudio hasta las 23:59 del día anterior</small><span class="cdn" data-cd="${L.getTime()}">${fmtCd(ms)}</span></div>`:""}</div>
    <div><div class="h-pct"><span class="big">${pct}%</span><div class="barra" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div><div class="desg">${esc(desg)}</div></div>
    ${ts.length?`<div class="chk">${lista}</div>`:""}
    <div class="acciones">${hayP?`<button class="btn-empezar" data-practicar="${esc(e.id)}">Practicar el examen aquí</button>`:""}<button class="btn-sec" data-det="${esc(e.id)}">Qué entra y apuntes</button></div></section>`}
setInterval(()=>{document.querySelectorAll("[data-cd]").forEach(el=>{el.textContent=fmtCd(+el.dataset.cd-Date.now())})},1000);
async function guardarTema(t,campos){const viejo={estado:t.estado,hechos:t.hechos};Object.assign(t,campos);render();
  try{await db.collection("temas").doc(t.id).update(campos)}catch(e){Object.assign(t,viejo);render();toast("No se ha guardado. Inténtalo otra vez.")}}
async function guardarPractica(eid,campos){const e=S.examenes.find(x=>x.id===eid);if(!e||!db||!S.canWrite)return;e.practica={...(e.practica||{}),...campos};
  try{await db.collection("examenes").doc(eid).update({practica:e.practica})}catch(x){}}
function proximos(){return S.examenes.filter(e=>!e.hecho&&e.fecha&&dias(e.fecha)>=0).sort((a,b)=>a.fecha.localeCompare(b.fecha))}
function examRow(e){const f=fechaCorta(e.fecha),d=dias(e.fecha),hp=hojas(e).length;
  let c;if(e.hecho)c=`<span class="count done">${e.nota!=null&&e.nota!==""?"Nota "+esc(e.nota):"Hecho"}${hp?" · Ver":""}</span>`;
  else if(d==null)c=`<span class="count">Sin fecha</span>`;
  else if(d<0)c=`<span class="count">Pasado</span>`;
  else c=`<span class="count ${d<=7?"soon":""}">${d===0?"Hoy":d===1?"Mañana":"En "+d+" días"}</span>`;

  if(g.t)o+=`<text x="${l}" y="11" class="${c}" style="font-weight:800">${esc(g.t)}</text>`;
  for(let k=0;k<=4;k++){const xv=g.xm*k/4,yv=g.ym*k/4;
    o+=`<line x1="${X(xv)}" y1="${t}" x2="${X(xv)}" y2="${t+ph}" stroke="#d8c9c0" stroke-width=".6"/><line x1="${l}" y1="${Y(yv)}" x2="${l+pw}" y2="${Y(yv)}" stroke="#d8c9c0" stroke-width=".6"/>`;

  o+=`<path d="M${l} ${t}V${t+ph}H${l+pw}" fill="none" stroke="#7a1010" stroke-width="1.5"/>`;

  (g.L||[]).forEach(([x1,y1,x2,y2,lab,st])=>{o+=`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${st==="b"?"#9b8f89":"#d4231c"}" stroke-width="${st==="b"?1.4:2.2}" ${st==="b"?'stroke-dasharray="4 3"':""} stroke-linecap="round"/>`;

  return o+"</svg>"}

<script type="module">
// Conexión del panel con Firebase: datos de la clase (data/clase.json) para cualquiera con el enlace;
// con cuenta de Google, además: progreso propio, amigos, ranking, perfil y chat.
import { db as fdb, fs, entrar as gEntrar, salir as gSalir, alCambiarSesion, alCambiarClase, conectado } from "./shared/fb.js";
let datos = null, prog = {}, quitar = [];
try { datos = await (await fetch("data/clase.json", { cache: "no-store" })).json(); }
catch (e) { S.error = "No se pudieron leer los datos del curso."; render(); }
// Los exámenes son por la mañana: a las 14:00 del día del examen pasa a "hecho".
const caducado = e => { const d = parseF(e.fecha); if (!d) return false; d.setHours(14, 0, 0, 0); return Date.now() >= d.getTime(); };
let firmaCad = "";
function aplicar() {
  if (!datos) return;
  const pt = prog.temas || {}, pp = prog.practica || {}, oc = prog.ocultos || {};
  S.temas = datos.temas.map(t => ({ ...t, ...(pt[t.id] || {}) }));
  S.examenes = datos.examenes.map(e => { const x = pp[e.id] ? { ...e, practica: pp[e.id] } : { ...e }; if (caducado(x)) x.hecho = true; return x; });
  firmaCad = S.examenes.filter(e => e.hecho).map(e => e.id).join();
  S.recursos = datos.recursos.filter(r => !oc[r.id]);
  S.ocultos = datos.recursos.filter(r => oc[r.id]);
  S.vocab = datos.vocab || []; S.practica = datos.practica || []; S.fallos = [];
  S.loaded = true; S.error = null; render();
}
setInterval(() => { if (!datos) return; const f = datos.examenes.filter(e => e.hecho || caducado(e)).map(e => e.id).join(); if (f !== firmaCad) aplicar(); }, 60000);
// Mismo "db" que usaba el panel, pero cada uno guarda SU progreso en progreso/{uid}
function adaptador(uid) {
  const ref = () => fs.doc(fdb, "progreso", uid);
  return { collection: (c) => ({ doc: (id) => ({ update: async (campos) => {
    if (c === "temas") return fs.setDoc(ref(), { temas: { [id]: campos } }, { merge: true });
    if (c === "examenes") return fs.setDoc(ref(), { practica: { [id]: campos.practica || {} } }, { merge: true });
    if (c === "recursos") return fs.setDoc(ref(), { ocultos: { [id]: !!campos.oculto } }, { merge: true });
  } }) }) };
}
function listo() {
  S.listo = true;
  document.getElementById("entrar").hidden = false;
  document.getElementById("gbtn").hidden = true;
  const m = document.getElementById("splmsg"); if (m) m.textContent = "";
  actualizarSplash();
  let ya = false; try { ya = sessionStorage.getItem("dentro") === "1"; } catch (e) {}
  if (ya) entrar(); else setTimeout(() => document.getElementById("entrar")?.focus(), 50);
}

async function sha(t) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
const RUTAS_VIVAS = ["amigos", "resumen", "perfil"];

  db = adaptador(user.uid);

  quitar.push(fs.onSnapshot(fs.doc(fdb, "progreso", user.uid), snap => { prog = snap.data() || {}; aplicar(); }, () => aplicar()));
  quitar.push(alCambiarClase(us => {
    S.amigos = us; S.conectados = Object.values(us).filter(conectado).length;

    if (RUTAS_VIVAS.includes(route())) render(); else if (route() === "chat") pintarChat();
  }));
  quitar.push(fs.onSnapshot(fs.collection(fdb, "progreso"), snap => {
    const r = {}; snap.docs.forEach(d => r[d.id] = d.data()); S.rank = r; if (RUTAS_VIVAS.includes(route())) render();
  }, () => {}));
  quitar.push(fs.onSnapshot(fs.query(fs.collection(fdb, "chat"), fs.orderBy("t"), fs.limitToLast(80)), snap => {
    S.chatError = null; S.chat = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  }, (err) => { S.chatError = err && err.code === "permission-denied" ? "El chat todavía no tiene permiso en Firebase: hay que pegar las reglas nuevas (Firestore → Reglas)." : "No se puede cargar el chat ahora mismo."; if (route() === "chat") pintarChat(); }));
});

// ---------- fotos: se reducen en el navegador y se guardan como texto (Firebase gratis, sin Storage) ----------
async function cargarImg(file) {
  try { if (window.createImageBitmap) return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch (e) {}
  return await new Promise((ok, ko) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { ok(img); setTimeout(() => URL.revokeObjectURL(url), 1000); }; img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("formato")); }; img.src = url; });
}
// cuadrado = recorte centrado (perfil); si no, se mantiene la proporción. maxB = tamaño máximo aproximado en bytes.
async function reducir(file, lado, cuadrado, maxB) {
  const img = await cargarImg(file), W = img.width, H = img.height;
  let L = lado;
  for (let intento = 0; intento < 6; intento++) {
    const c = document.createElement("canvas"), x = c.getContext("2d");
    if (cuadrado) { const m = Math.min(W, H); c.width = c.height = Math.min(L, m); x.drawImage(img, (W - m) / 2, (H - m) / 2, m, m, 0, 0, c.width, c.height); }
    else { const k = Math.min(1, L / Math.max(W, H)); c.width = Math.round(W * k); c.height = Math.round(H * k); x.drawImage(img, 0, 0, c.width, c.height); }
    for (const q of [0.82, 0.7, 0.58]) { const d = c.toDataURL("image/jpeg", q); if (d.length * 0.75 <= maxB) return d; }
    L = Math.round(L * 0.75);
  }
  throw new Error("grande");
}
window.subirFoto = async (file) => {
  if (!S.uid) { toast("Entra con Google para cambiar la foto."); return; }
  if (file.type && !/^image\//.test(file.type)) { toast("Eso no es una imagen."); return; }
  toast("Subiendo foto…");
  let d;
  try { d = await reducir(file, 320, true, 120000); }
  catch (e) { toast("No se puede leer esa imagen. Prueba con otra (JPG o PNG)."); return; }
  try { await fs.setDoc(fs.doc(fdb, "usuarios", S.uid), { fotoPropia: d }, { merge: true }); toast("¡Foto cambiada!"); }
  catch (e) { toast("Firebase no deja guardarla (" + (e.code || "error") + "). Revisa las reglas."); }
};
window.adjuntarFotos = async (files) => {

    if (f.type && !/^image\//.test(f.type)) { toast("Solo se pueden adjuntar fotos."); continue; }
    try { window.ADJ.push(await reducir(f, 1280, false, 230000)); pintarAdj(); }
    catch (e) { toast("No se puede leer una de las fotos."); }
  }
};
