<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Afijomat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: one column on a phone with a bottom tab bar; on desktop a left sidebar and a centred working column.
   The memorable part is the word tile: the base word is a paper tile, the affix is a coloured tile that snaps onto it. */
:root{
  --bg-deep:#0f0b17; --bg:#161022; --panel:#1f1830; --panel-2:#2a2140; --border:#3d3259;
  --text:#f2eefb; --text-dim:#aaa0c6; --text-faint:#7f759c;
  --pre:#ffb454; --pre-ink:#2b1800; --suf:#6cc7ff; --suf-ink:#05243a;
  --stem:#efe9dc; --stem-ink:#1e1731; --link:#f08cff;
  --accent:#efe9dc; --accent-ink:#1e1731; --focus:#6cc7ff;
  --good:#5fe3a4; --bad:#ff7088;
  --hole:#0b0812; --hole-shadow:rgba(0,0,0,.8); --hole-rim:rgba(255,255,255,.06);
  --f-display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Martian Mono','JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg-deep:#e8e4f1; --bg:#f4f1fa; --panel:#ffffff; --panel-2:#ece8f6; --border:#cfc6e3;
    --text:#1e1731; --text-dim:#5c5377; --text-faint:#80779b;
    --pre:#b85a05; --pre-ink:#fff6ea; --suf:#0a6cae; --suf-ink:#eff8ff;
    --stem:#1e1731; --stem-ink:#f4f1fa; --link:#b02fd0;
    --accent:#1e1731; --accent-ink:#f4f1fa; --focus:#0a6cae;
    --good:#0b8a5b; --bad:#c42849;
    --hole:#dcd6ea; --hole-shadow:rgba(30,23,49,.3); --hole-rim:rgba(255,255,255,.95);
    color-scheme:light;
  }
}
:root[data-theme="dark"]{
  --bg-deep:#0f0b17; --bg:#161022; --panel:#1f1830; --panel-2:#2a2140; --border:#3d3259;
  --text:#f2eefb; --text-dim:#aaa0c6; --text-faint:#7f759c;
  --pre:#ffb454; --pre-ink:#2b1800; --suf:#6cc7ff; --suf-ink:#05243a;
  --stem:#efe9dc; --stem-ink:#1e1731; --link:#f08cff;
  --accent:#efe9dc; --accent-ink:#1e1731; --focus:#6cc7ff;
  --good:#5fe3a4; --bad:#ff7088;
  --hole:#0b0812; --hole-shadow:rgba(0,0,0,.8); --hole-rim:rgba(255,255,255,.06);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg-deep:#e8e4f1; --bg:#f4f1fa; --panel:#ffffff; --panel-2:#ece8f6; --border:#cfc6e3;
  --text:#1e1731; --text-dim:#5c5377; --text-faint:#80779b;
  --pre:#b85a05; --pre-ink:#fff6ea; --suf:#0a6cae; --suf-ink:#eff8ff;
  --stem:#1e1731; --stem-ink:#f4f1fa; --link:#b02fd0;
  --accent:#1e1731; --accent-ink:#f4f1fa; --focus:#0a6cae;
  --good:#0b8a5b; --bad:#c42849;
  --hole:#dcd6ea; --hole-shadow:rgba(30,23,49,.3); --hole-rim:rgba(255,255,255,.95);
  color-scheme:light;
}

*{box-sizing:border-box;}
body{
  background:var(--bg-deep); color:var(--text); margin:0;
  font-family:var(--f-body); font-size:15px; line-height:1.45;
  display:flex; justify-content:center;
}
button,input,textarea{font-family:inherit; color:inherit;}
h1,h2,h3,p,ul,ol{margin:0; padding:0;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

#app{
  width:100%; max-width:560px; min-height:100dvh; background:var(--bg);
  display:flex; flex-direction:column; border-inline:1px solid var(--border);
}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border);
}
.topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
.wordmark{display:inline-flex; font-family:var(--f-display); font-weight:800; font-size:21px; letter-spacing:-.02em; line-height:1;}
.wordmark span{display:inline-block; padding:.22em .42em .26em;}
.wm-a{background:var(--stem); color:var(--stem-ink); border-radius:.3em 0 0 .3em;}
.wm-b{background:var(--suf); color:var(--suf-ink); border-radius:0 .3em .3em 0; position:relative;}
.wm-b::before{content:""; position:absolute; left:-.16em; top:50%; width:.32em; height:.32em; margin-top:-.16em; border-radius:50%; background:var(--suf);}
.soundbtn{
  flex:0 0 auto; width:30px; height:30px; padding:0; display:grid; place-items:center;
  background:none; border:1px solid var(--border); border-radius:8px; color:var(--text-dim); cursor:pointer;
}
.soundbtn svg{width:16px; height:16px;}
.soundbtn:hover{color:var(--text);}
.daybadge{font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; text-align:right;}
.daybadge b{font-family:var(--f-display); font-size:17px; color:var(--text);}
.daybadge.pending b{color:var(--text-dim);}

.screen{flex:1; padding:18px 16px 32px; display:flex; flex-direction:column; gap:16px; min-width:0;}

.tabbar{
  position:sticky; bottom:0; z-index:10; display:flex; gap:2px;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  background:var(--panel); border-top:1px solid var(--border);
}
.tab{
  flex:1; min-width:0; background:none; border:none; cursor:pointer; padding:10px 0; border-radius:10px;
  font-size:12.5px; font-weight:600; color:var(--text-faint); text-align:center; white-space:nowrap;
}
.tab .k{display:none;}
.tab.active{color:var(--text); background:var(--panel-2);}
.tab:hover{color:var(--text);}
.kbd-help{display:none;}

.toast{
  position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:30;
  transform:translate(-50%,10px); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  background:var(--text); color:var(--bg); padding:9px 14px; border-radius:10px; font-size:13px; max-width:calc(100% - 32px);
}
.toast.show{opacity:1; transform:translate(-50%,0);}

/* ---------- type & generic ---------- */
.eyebrow{font-size:12.5px; font-weight:600; color:var(--text-dim);}
.h2{font-family:var(--f-display); font-size:25px; font-weight:800; letter-spacing:-.02em; text-wrap:balance; line-height:1.15;}
.intro{font-size:14.5px; color:var(--text-dim); line-height:1.55; max-width:62ch;}
.small{font-size:12.5px;} .dim{color:var(--text-dim);}
.hero{display:flex; flex-direction:column; gap:8px;}
.linkbtn{background:none; border:none; color:var(--text); font-size:14px; font-weight:600; cursor:pointer; padding:6px 0;}
.linkbtn.faintlink{color:var(--text-faint); font-weight:400; text-decoration:underline; font-size:12.5px; align-self:center;}
.linkbtn.danger{color:var(--bad);}
.note{font-size:13.5px; color:var(--text-dim); text-align:center; text-wrap:balance;}

.btn{border:none; border-radius:12px; padding:14px 18px; font-size:15.5px; font-weight:700; cursor:pointer; text-align:center;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:active{opacity:.85;}
.btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
.btn-block{width:100%;}
.btn-col{display:flex; flex-direction:column; gap:10px;}

.stat-strip{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.stat{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0;}
.stat .n{font-family:var(--f-display); font-size:27px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;}
.stat .n small{font-size:.58em; color:var(--text-faint); font-weight:600;}
.stat .l{font-size:12.5px; color:var(--text-dim); line-height:1.3;}

.box{border:1px dashed var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; background:var(--panel-2);}
.box .h{font-size:13px; font-weight:700; color:var(--text-dim);}
.box textarea{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; font-size:12px; resize:vertical; min-height:76px; font-family:var(--f-mono); width:100%;}
.warn{border:1px solid color-mix(in srgb, var(--bad) 45%, var(--border)); background:color-mix(in srgb, var(--bad) 8%, var(--panel)); border-radius:12px; padding:10px 12px; font-size:13px;}
.sync-row{display:flex; gap:10px; flex-wrap:wrap;}
.sync-row .btn{flex:1 1 180px; font-size:14px; padding:12px 14px;}

.seg{display:flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:4px;}
.seg button{flex:1; min-width:0; border:none; background:none; border-radius:9px; padding:9px 6px; font-size:13.5px; font-weight:600; color:var(--text-dim); cursor:pointer;}
.seg button.active{background:var(--accent); color:var(--accent-ink);}

.section-h{font-family:var(--f-display); font-weight:800; font-size:17px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:6px;}
.section-h small{font-family:var(--f-body); font-weight:500; color:var(--text-faint); font-size:12.5px; text-align:right;}

/* ---------- tiles ---------- */
.tile{
  position:relative; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  font-family:var(--f-mono); font-weight:700; letter-spacing:-.02em; line-height:1.1;
  padding:.22em .45em; border-radius:.3em;
}
.tile.stem{background:var(--stem); color:var(--stem-ink);}
.tile.affix.pre{background:var(--pre); color:var(--pre-ink);}
.tile.affix.suf{background:var(--suf); color:var(--suf-ink);}
.tile.sm{font-size:15px;} .tile.xs{font-size:12.5px; padding:.14em .4em;}
.tile .lk, .lk{font-style:normal; color:var(--link); text-decoration:underline; text-decoration-thickness:.07em; text-underline-offset:.12em;}
.tile.stem .lk{color:var(--link);}
.tiles{
  display:inline-flex; align-items:stretch; position:relative; max-width:100%;
  font-size:clamp(17px, calc(min(78vw, 500px) / (var(--n) * .75 + 2.2)), 54px);
  filter:drop-shadow(0 .07em 0 rgba(0,0,0,.35));
}
.tiles .tile{padding:.3em .5em;}
.tiles .tile:first-child{border-radius:.3em 0 0 .3em;}
.tiles .tile:last-child{border-radius:0 .3em .3em 0;}
.tiles.single .tile{border-radius:.3em;}
.tiles .tile.affix::before{content:""; position:absolute; top:50%; width:.46em; height:.46em; margin-top:-.23em; border-radius:50%; z-index:1;}
.tiles.is-suf .tile.affix.suf::before{left:-.23em; background:var(--suf);}
.tiles.is-pre .tile.affix.pre::before{right:-.23em; background:var(--pre);}
@keyframes snap-suf{0%{transform:translateX(1.3em); opacity:0;} 55%{transform:translateX(-.09em); opacity:1;} 100%{transform:none; opacity:1;}}
@keyframes snap-pre{0%{transform:translateX(-1.3em); opacity:0;} 55%{transform:translateX(.09em); opacity:1;} 100%{transform:none; opacity:1;}}
.tiles.is-suf .tile.affix.snap{animation:snap-suf .5s cubic-bezier(.2,.9,.3,1) .12s both;}
.tiles.is-pre .tile.affix.snap{animation:snap-pre .5s cubic-bezier(.2,.9,.3,1) .12s both;}

.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}
.chip{font-size:13px; border:1px solid var(--border); border-radius:999px; padding:4px 12px; background:var(--panel-2); color:var(--text-dim);}
.chip.tr{color:var(--text); font-style:italic;}
.btnchip{cursor:pointer; color:var(--text); border-style:dashed; font-weight:600;}
.btnchip:hover{border-color:var(--text-dim);}

/* ---------- map ---------- */
.last-card{display:flex; flex-direction:column; gap:3px; text-align:left; cursor:pointer; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; color:var(--text);}
.last-card .lc-main{font-size:15.5px;} .last-card .lc-main b{font-family:var(--f-display); font-size:19px;}
.last-card .lc-link{font-size:13px; color:var(--text-dim); font-weight:600;}
.last-card:hover{border-color:var(--text-dim);}
.route-done{text-align:center; color:var(--good); font-weight:700;}
.unit{display:flex; flex-direction:column;}
.unit-band{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; border-left:5px solid var(--text-faint);}
.unit-band.pre{border-left-color:var(--pre);} .unit-band.suf{border-left-color:var(--suf);}
.u-t{font-family:var(--f-display); font-weight:800; font-size:17px;}
.u-s{font-size:12.5px; color:var(--text-faint);}
.u-c{font-family:var(--f-display); font-weight:800; font-size:17px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
.path{display:flex; flex-direction:column; align-items:center; gap:26px; padding:42px 0 20px;}
.node-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; transform:translateX(var(--x,0px));}
.node-wrap.has-bubble{margin-top:16px;}
.path > .node-wrap.has-bubble:first-child{margin-top:0;}
.node{
  width:68px; height:68px; border-radius:22px; border:none; padding:0; cursor:pointer; position:relative;
  display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:25px; transition:transform .12s;
}
.node:active{transform:translateY(2px);}
.node.plain{background:var(--panel-2); color:var(--text-dim); box-shadow:inset 0 -5px 0 rgba(0,0,0,.18), inset 0 0 0 2px var(--border);}
.node.is-current.pre{background:var(--pre); color:var(--pre-ink);}
.node.is-current.suf{background:var(--suf); color:var(--suf-ink);}
.node.is-current{box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), 0 0 0 6px color-mix(in srgb, var(--text) 14%, transparent); animation:ring 2.4s ease-in-out infinite;}
@keyframes ring{50%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), 0 0 0 11px color-mix(in srgb, var(--text) 4%, transparent);}}
.node.medal{box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 0 0 3px rgba(255,255,255,.3), 0 3px 10px rgba(0,0,0,.25);}
.node-label{font-size:13px; color:var(--text-dim); max-width:150px; text-align:center; line-height:1.25; font-weight:600;}
.node-sub{font-size:12px; color:var(--text-faint); margin-top:-3px;}
.bubble{
  position:absolute; top:-33px; left:50%; transform:translateX(-50%); white-space:nowrap;
  background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:4px 10px;
  font-size:11.5px; font-weight:800; letter-spacing:.08em;
}
.bubble::after{content:""; position:absolute; left:50%; bottom:-5px; width:8px; height:8px; background:var(--panel); border-right:1px solid var(--border); border-bottom:1px solid var(--border); transform:translateX(-50%) rotate(45deg);}

.m-gold{background:radial-gradient(circle at 34% 28%, #fff4c4 0 12%, #f6d360 34%, #d39f22 68%, #9a6c0a 100%); color:#3b2700;}
.m-silver{background:radial-gradient(circle at 34% 28%, #ffffff 0 12%, #e3e7ee 34%, #aab3c1 68%, #717b8c 100%); color:#1d232e;}
.m-bronze{background:radial-gradient(circle at 34% 28%, #ffe3c8 0 12%, #e0a46e 34%, #aa6a34 68%, #6e3f18 100%); color:#2b1606;}
.hole{background:var(--hole); box-shadow:inset 0 3px 8px var(--hole-shadow), 0 1px 0 var(--hole-rim);}

/* ---------- level intro ---------- */
.lv-intro{display:flex; gap:14px; align-items:flex-start;}
.lv-badge{flex:0 0 auto; width:58px; height:58px; border-radius:20px; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:24px;}
.lv-badge.plain{background:var(--panel-2); color:var(--text-dim); box-shadow:inset 0 0 0 2px var(--border);}
.lv-badge.medal{box-shadow:inset 0 0 0 3px rgba(255,255,255,.3), inset 0 -4px 7px rgba(0,0,0,.22);}
.rule{font-size:14.5px; color:var(--text-dim); line-height:1.55; margin-top:6px;}
.aff-list{display:flex; flex-direction:column; gap:8px;}
.aff-row{display:flex; gap:12px; align-items:baseline; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
.aff-row .tile{flex:0 0 auto; min-width:64px;}
.aff-ex{font-size:14px; color:var(--text-dim); min-width:0; overflow-wrap:anywhere;}
.nb{text-decoration:underline dotted; text-underline-offset:3px; text-decoration-color:var(--text-faint);}
.thresholds{font-size:12.5px; color:var(--text-faint); text-align:center; line-height:1.5;}

/* ---------- quiz ---------- */
.quizhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13.5px; color:var(--text-dim);}
.qtitle b{color:var(--text); font-variant-numeric:tabular-nums;}
.runbox{font-size:12.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap;}
.runbox b{display:inline-block; font-family:var(--f-display); color:var(--text); font-size:17px; min-width:1ch; text-align:center;}
.runbox.hot b{color:var(--pre);}
.runbox.bump b{animation:bump .35s ease;}
@keyframes bump{50%{transform:scale(1.4);}}
.pbar{height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden;}
.pbar i{display:block; height:100%; background:var(--text); border-radius:0 4px 4px 0; transition:width .25s;}
.stage{background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:22px 16px 18px; display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0;}
.stage > *{max-width:100%;}
.ask{font-size:13.5px; color:var(--text-dim);}
.trickshow{font-size:13.5px; background:var(--panel-2); border:1px dashed var(--border); border-radius:10px; padding:8px 12px; text-align:left; width:100%;}
.answer{
  width:100%; min-width:0; background:var(--bg); border:2px solid var(--border); border-radius:14px; padding:14px 12px; text-align:center;
  font-family:var(--f-mono); font-weight:700; font-size:clamp(17px,5.4vw,24px); letter-spacing:-.01em; color:var(--text);
}
.answer::placeholder{color:var(--text-faint); font-weight:500; font-size:.7em;}
.answer:focus{outline:none; border-color:var(--text); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);}
.answer.ok{border-color:var(--good); color:var(--good);} .answer.ko{border-color:var(--bad); color:var(--bad);}
.answer.shake{animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
#qBtn{width:100%;}
.fb{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; width:100%;}
.fb-head{font-family:var(--f-display); font-weight:800; font-size:22px;}
.fb-head.good{color:var(--good);} .fb-head.bad{color:var(--bad);}
.fb-aff{font-size:14px; color:var(--text-dim); line-height:1.7;}
.fb-aff em{font-style:normal; color:var(--text); font-weight:600;}
.fb-aff small{color:var(--text-faint);}
.fb-form{font-size:13.5px; color:var(--text-dim);} .fb-form b{font-family:var(--f-mono); color:var(--text);}
.fb-yours{font-size:14px; color:var(--text-dim);}
.fb-yours s{color:var(--bad); font-family:var(--f-mono);}
.fb-msg{display:block; margin-top:2px; color:var(--text);}
.fb-rule, .fb-truco{font-size:13.5px; background:var(--panel-2); border-radius:10px; padding:9px 12px; width:100%; text-align:left; color:var(--text-dim);}
.fb-rule b, .fb-truco b{color:var(--text); margin-right:6px;}

/* ---------- summary ---------- */
.sum-hero{display:flex; flex-direction:column; align-items:center; gap:6px; padding:4px 0;}
.sum-score{font-family:var(--f-display); font-weight:800; font-size:56px; line-height:1; font-variant-numeric:tabular-nums;}
.sum-score small{font-size:.45em; color:var(--text-faint);}
.pct-chip{font-size:13px; font-weight:700; padding:3px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--border);}
.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
.kpis .stat{padding:10px 12px;} .kpis .stat .n{font-size:23px;} .kpis .stat .l{font-size:12px;}
.perfect-note{text-align:center; color:var(--good); font-weight:700; padding:6px 0;}
.medal-stage{position:relative; width:128px; height:128px; margin:4px auto 0;}
.medal-stage > div{position:absolute; inset:0; border-radius:50%; display:grid; place-items:center;}
.medal-stage .medal{font-family:var(--f-display); font-weight:800; font-size:44px; box-shadow:inset 0 0 0 5px rgba(255,255,255,.3), inset 0 -8px 14px rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3);}
.medal-stage .medal.drop{animation:drop .8s cubic-bezier(.2,1.5,.45,1) .25s both;}
@keyframes drop{from{transform:translateY(-70px) scale(.55); opacity:0;} to{transform:none; opacity:1;}}
.colbars{display:flex; flex-direction:column; gap:11px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;}
.colbars:not(.prog):not(.lrs){display:grid; grid-template-columns:max-content minmax(40px,1fr) max-content; gap:11px 12px; align-items:center;}
.cb-row{display:contents;}
.cb-label{display:flex; align-items:center; gap:6px; min-width:0;}
.cb-track{height:10px; background:var(--panel-2); border-radius:0 4px 4px 0; overflow:hidden;}
.cb-track i{display:block; height:100%; background:var(--bad); border-radius:0 4px 4px 0;}
.cb-val{font-size:13px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700;}
.cb-val small{color:var(--text-faint); font-weight:500;}
.fail-list{display:flex; flex-direction:column; gap:8px;}
.fail-item{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:14px;}
.fi-base{color:var(--text-dim); font-family:var(--f-mono); font-size:13px;}
.fi-arrow{color:var(--text-faint);}
.fi-ans{font-family:var(--f-mono); font-size:14px;}
.fi-yours{margin-left:auto; color:var(--text-faint); font-size:12.5px;}
.fi-yours s{color:var(--bad); font-family:var(--f-mono);}

/* ---------- practice ---------- */
.mode-grid{display:grid; grid-template-columns:1fr; gap:12px;}
.mode-btn{display:flex; flex-direction:column; align-items:stretch; gap:4px; text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:15px 17px; cursor:pointer; color:var(--text); transition:border-color .15s;}
.mode-btn:hover:not(:disabled){border-color:var(--text-dim);}
.mode-btn:disabled{opacity:.55; cursor:default;}
.mb-top{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.mode-btn .tag{font-size:12px; font-weight:700; color:var(--pre);}
.mode-btn .badge{font-size:12px; background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border); border-radius:20px; padding:2px 10px; font-variant-numeric:tabular-nums; white-space:nowrap;}
.mode-btn .title{font-family:var(--f-display); font-size:19px; font-weight:800;}
.mode-btn .desc{font-size:13.5px; color:var(--text-dim); line-height:1.45;}

/* ---------- exam sheet ---------- */
.xlist{list-style:none; display:flex; flex-direction:column; gap:10px;}
.xrow{display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px;}
.xrow.is-ok{border-color:color-mix(in srgb, var(--good) 55%, var(--border));}
.xrow.is-ko{border-color:color-mix(in srgb, var(--bad) 55%, var(--border));}
.xn{font-family:var(--f-display); font-weight:800; color:var(--text-faint); padding-top:6px; font-variant-numeric:tabular-nums;}
.xbody{display:flex; flex-direction:column; gap:8px; min-width:0;}
.xmain{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.xbody .chips{justify-content:flex-start;}
.xarrow{color:var(--text-faint);}
.xin{flex:1 1 150px; min-width:0; background:var(--bg); border:2px solid var(--border); border-radius:10px; padding:9px 10px; font-family:var(--f-mono); font-weight:700; font-size:16px; color:var(--text);}
.xin:focus{outline:none; border-color:var(--text);}
.xin.ok{border-color:var(--good); color:var(--good);} .xin.ko{border-color:var(--bad); color:var(--bad);}
.xfb{font-size:13.5px;} .xfb.good{color:var(--good); font-weight:700;} .xfb.bad{color:var(--text-dim);} .xfb.bad b{font-family:var(--f-mono); color:var(--text);}

/* ---------- notes ---------- */
.searchbox{position:relative; display:flex; align-items:center;}
.searchbox svg{position:absolute; left:13px; width:17px; height:17px; color:var(--text-faint); pointer-events:none;}
.searchbox input{width:100%; min-width:0; -webkit-appearance:none; appearance:none; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px 12px 40px; font-size:16px; color:var(--text);}
.searchbox input::placeholder{color:var(--text-faint);}
.searchbox input:focus{outline:none; border-color:var(--text-dim);}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none; display:none;}
.ac-grid{display:grid; grid-template-columns:1fr; gap:12px;}
.affix-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0;}
.affix-card header{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.ac-prog{font-size:12.5px; color:var(--text-faint);}
.ac-mean{font-size:13.5px; color:var(--text-dim);} .ac-mean b{color:var(--text);}
.ac-ex{list-style:none; display:flex; flex-wrap:wrap; gap:6px 14px; font-family:var(--f-mono); font-size:13.5px;}
.ac-ex small{font-family:var(--f-body); color:var(--text-faint); font-size:12px;}
.ac-trick{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--text-faint);}
.ac-trick textarea{width:100%; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:14px; line-height:1.4; resize:none; overflow:hidden; min-height:40px; color:var(--text);}
.ac-trick textarea:focus{outline:none; border-color:var(--text-dim);}
.empty{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px 18px; text-align:center; color:var(--text-dim);}

/* ---------- progress ---------- */
.colbars.prog{display:grid; grid-template-columns:max-content minmax(40px,1fr) max-content; gap:9px 12px; align-items:center;}
.pr-row{display:contents;}
.pr-label{display:flex; align-items:center; gap:6px;}
.ctag{font-size:11.5px; color:var(--text-faint); white-space:nowrap;}
.pr-track{height:9px; background:var(--panel-2); border-radius:0 4px 4px 0; overflow:hidden;}
.pr-track i{display:block; height:100%; background:var(--text-dim); border-radius:0 4px 4px 0;}
.pr-track i.full{background:var(--good);}
.pr-val{font-size:13px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums;}
.pr-val small{color:var(--text-faint); font-weight:500;}

@media (min-width:460px){ .mode-grid{grid-template-columns:1fr 1fr;} }

/* ================= tablet and desktop ================= */
@media (min-width:640px){
  #app{max-width:780px;}
  .topbar{padding:14px 26px;}
  .screen{padding:24px 28px 38px; gap:18px;}
  .stat-strip{grid-template-columns:repeat(4,minmax(0,1fr));}
  .h2{font-size:29px;}
  .intro{font-size:15.5px;}
  .stage{padding:30px 28px 24px;}
  .ac-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .xrow{padding:14px 16px;}
}
@media (min-width:1024px){
  body{display:block; padding-inline:24px;}
  #app{max-width:1200px; margin:0 auto; display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; grid-template-areas:"top top" "side main";}
  .topbar{grid-area:top; padding:14px 30px;}
  .screen{grid-area:main; padding:34px 48px 56px; gap:20px; max-width:940px; width:100%;}
  .tabbar{grid-area:side; position:sticky; top:calc(env(safe-area-inset-top,0px) + 64px); bottom:auto; align-self:start; flex-direction:column; gap:4px; height:calc(100dvh - 64px); padding:22px 14px; border-top:none; border-right:1px solid var(--border);}
  .tab{flex:0 0 auto; display:flex; justify-content:space-between; align-items:center; text-align:left; padding:12px 14px; font-size:14.5px;}
  .tab .k{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; font-family:var(--f-mono); font-size:11px; color:var(--text-faint); font-weight:500;}
  .kbd-help{display:block; margin-top:auto; padding:12px 6px 0; border-top:1px dashed var(--border); font-size:12.5px; line-height:1.8; color:var(--text-faint);}
  .toast{bottom:32px;}
  .mode-grid{gap:14px;} .mode-btn{padding:18px 20px;}
  .screen > .btn-block, .screen .btn-col{max-width:440px;}
  .stage{max-width:640px; align-self:flex-start; width:100%;}
  .quizhead, .pbar{max-width:640px;}
  .path{gap:30px;}
  .node{width:76px; height:76px; font-size:28px;}
  .ac-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .xlist{max-width:720px;}
}
@media (min-width:1024px) and (hover:none){ .kbd-help{display:none;} }
@media (prefers-reduced-motion: reduce){
  .node.is-current, .runbox.bump b, .medal-stage .medal.drop, .answer.shake{animation:none;}
  .tiles .tile.affix.snap{animation:none !important;}
  .toast, .pbar i{transition:none;}
}

/* progress by level */
.colbars.lrs{gap:13px;}
.lr{display:flex; flex-direction:column; gap:6px;}
.lr-top{display:flex; align-items:center; gap:10px; min-width:0;}
.lr-n{font-family:var(--f-display); font-weight:800; color:var(--text-faint); min-width:1.6em; font-variant-numeric:tabular-nums;}
.lr-t{flex:1; min-width:0; font-size:14px; font-weight:600; overflow-wrap:anywhere;}
.lr-medal{flex:0 0 auto; width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);}
.aff-details{display:flex; flex-direction:column; gap:10px;}
.aff-details > summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--text-dim); padding:6px 0;}
.aff-details[open] > summary{margin-bottom:4px;}

function normW(s){
  return String(s == null ? "" : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[\s\-'’._]/g,"");
}

    if(!m) return {w:w.trim(), nobase:false, gloss:""};
    var o = {w:m[1], nobase:!!m[2], gloss:m[3] || ""};
    if(o.gloss === "s"){ o.w += "(s)"; o.gloss = ""; }
    return o;
  });
  var a = {id:r[0], label:r[1], kind:r[2], cls:r[3], en:r[4], es:r[5], ex:ex, note:r[7], items:[]};

      if(i > 0) opt[kv.slice(0, i).trim()] = kv.slice(i + 1).trim();

/* ================= CORE: grading, splitting words for display, spaced repetition ================= */
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev = [], cur = [];
  for(j = 0; j <= n; j++) prev[j] = j;
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

/* typed answer vs item. Hyphens, spaces and capitals do not matter ("pre-war" = "prewar"). */
function grade(item, typed){
  var t = normW(typed);
  if(!t) return {ok:false, why:"empty", msg:""};
  if(item.accepted.indexOf(t) >= 0) return {ok:true, why:"ok", msg:""};
  if(item.near[t]) return {ok:false, why:"variant", msg:item.near[t]};
  if(t === normW(item.base)) return {ok:false, why:"base", msg:"Has repetido la palabra base. Falta añadir el prefijo o el sufijo."};
  var best = 99;
  item.accepted.forEach(function(a){ best = Math.min(best, lev(t, a)); });
  if(best <= 2 && t.length >= 4) return {ok:false, why:"spelling", msg:"Muy cerca: revisa la ortografía."};
  if(t.indexOf(normW(item.base)) >= 0) return {ok:false, why:"affix", msg:"Tienes bien la base, pero el prefijo o sufijo no es el que se pide."};
  return {ok:false, why:"wrong", msg:""};
}

/* how to draw the formed word as tiles: stem + (link letters) + affix */
function splitParts(item){
  var ans = item.ans, pre = item.kind === "pre", stem = "", link = "", affix = "";
  if(item.sp){
    var p = item.sp.split("|");
    if(p.length === 2){ stem = p[0]; affix = p[1]; }
    else if(p.length === 3){ stem = p[0]; link = p[1]; affix = p[2]; }
  }
  if(!stem && !affix){
    if(pre){
      var idx = ans.toLowerCase().lastIndexOf(item.base.toLowerCase());
      if(idx > 0 && idx + item.base.length === ans.length){ affix = ans.slice(0, idx); stem = ans.slice(idx); }
    } else {
      var a = ans.toLowerCase(), b = item.base.toLowerCase(), k = 0;
      while(k < a.length && k < b.length && a.charAt(k) === b.charAt(k)) k++;
      if(k > 0 && k < a.length){ stem = ans.slice(0, k); affix = ans.slice(k); }
    }
  }
  if(!stem && !affix){ stem = ans; }
  /* the join between tiles replaces the hyphen */
  if(pre) affix = affix.replace(/-+$/, "");
  stem = stem.replace(/^-+/, "");
  return {pre:pre, stem:stem, link:link, affix:affix};
}

/* ---------- spaced repetition (Leitner boxes) ---------- */
var BOX_WAIT = [0, 5*60e3, 3600e3, 86400e3, 3*86400e3, 7*86400e3];
function newStat(){ return {seen:0, ok:0, ko:0, hint:0, box:0, due:0, streak:0, last:-1}; }
function applyResult(stat, ok, hinted, now){
  stat.seen++;
  if(ok){
    stat.ok++;
    if(hinted){ stat.hint++; }
    else { stat.streak++; stat.box = Math.min(5, stat.box + 1); }
  } else {
    stat.ko++; stat.streak = 0; stat.box = 0;
  }
  stat.last = ok ? 1 : 0;
  stat.due = now + BOX_WAIT[stat.box];
  return stat;
}
function isMastered(stat){ return !!stat && stat.streak >= 3; }
function shuffleArr(a){ for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* "Repaso inteligente": what is due first, then what you fail, then what you never saw */
function pickSmart(items, stats, n, now){
  var scored = items.map(function(it){
    var s = stats[it.id], p;
    if(!s || !s.seen) p = 40 + Math.random() * 10;
    else if(s.due <= now) p = 100 + (5 - s.box) * 10 + Math.min(s.ko, 5) * 3 + Math.random() * 6;
    else p = Math.random() * 10;
    return {it:it, p:p};
  });
  scored.sort(function(a, b){ return b.p - a.p; });
  return shuffleArr(scored.slice(0, n).map(function(x){ return x.it; }));
}

function tierFor(ok, n, hinted){
  if(ok >= n && !hinted) return 3;
  if(ok >= Math.ceil(n * 0.8 - 1e-9)) return 2;
  if(ok >= Math.ceil(n * 0.6 - 1e-9)) return 1;
  return 0;
}

var CORE = {lev:lev, grade:grade, splitParts:splitParts, BOX_WAIT:BOX_WAIT, newStat:newStat, applyResult:applyResult,

}
function tone(c, freq, t0, dur, o){
  o = o || {};

  osc.frequency.setValueAtTime(freq, t0);
  if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t0 + dur);
  var peak = o.vol == null ? 0.14 : o.vol;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.012, dur * 0.3));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(c.destination);

}

  return scopeItems(scope).filter(function(it){ var s = statOf(it.id); return s && s.seen && (s.last === 0 || (s.ko > 0 && s.streak < 2)); })
    .sort(function(a, b){ return statOf(b.id).ko - statOf(a.id).ko; });
}
function dueCount(scope){ var now = Date.now(); return scopeItems(scope).filter(function(it){ var s = statOf(it.id); return !s || !s.seen || s.due <= now; }).length; }
function segHTML(name, opts, cur){

function gradeExam(){
  var X = ui.exam;
  X.answers = X.items.map(function(_, i){ var e = $("#xin-" + i); return e ? e.value : X.answers[i]; });
  X.results = X.items.map(function(it, i){
    var g = grade(it, X.answers[i]);
    recordResult(it, g.ok, false);
    return {ok:g.ok, msg:g.why === "empty" ? "" : g.msg};
  });
  X.graded = true;
  var ok = X.results.filter(function(r){ return r.ok; }).length;
  state.exams.unshift({t:Date.now(), n:X.items.length, ok:ok, scope:X.scope});
  state.exams = state.exams.slice(0, 10);
  bumpDaily(); save();
  render();
  setTimeout(function(){ if(ok === X.items.length) playMedal(3); else if(ok / X.items.length >= .6) playMedal(1); }, 250);
}

/* ================= NOTES (the sheets + your own tricks) ================= */
function norm2(s){ return normW(s); }
function affixMatches(a, q){
  if(!q) return true;
  var n = norm2(q);
  if(norm2(a.label).indexOf(n) >= 0 || norm2(a.en).indexOf(n) >= 0 || norm2(a.es).indexOf(n) >= 0) return true;
  return a.ex.some(function(e){ return norm2(e.w).indexOf(n) >= 0 || norm2(e.gloss).indexOf(n) >= 0; });
}
function affixCardHTML(a){
  var st = a.items.map(function(id){ return statOf(id); });
  var m = st.filter(isMastered).length;
  var meaning = a.kind === "pre" ? '<div class="ac-mean"><b>' + esc(a.en) + '</b> · ' + esc(a.es) + '</div>' : (a.note ? '<div class="ac-mean">' + esc(a.note) + '</div>' : "");
  return '<article class="affix-card" id="aff-' + a.id + '"><header><span class="tile affix ' + a.kind + ' sm">' + esc(a.label) + '</span>' +
    (a.items.length ? '<span class="ac-prog">' + m + '/' + a.items.length + ' dominadas</span>' : '<span class="ac-prog">solo apuntes</span>') + '</header>' + meaning +
    '<ul class="ac-ex">' + a.ex.map(function(e){ return '<li class="' + (e.nobase ? "nb" : "") + '">' + esc(e.w) + (e.gloss ? ' <small>' + esc(e.gloss) + '</small>' : "") + '</li>'; }).join("") + '</ul>' +
    '<label class="ac-trick"><span>Tu truco</span><textarea data-trick="' + a.id + '" id="trick-' + a.id + '" rows="1" placeholder="Escribe aquí cómo te acuerdas de este afijo">' + esc(state.tricks[a.id] || "") + '</textarea></label></article>';
}
function notesListHTML(){
  var q = ui.notesQ.trim(), searching = !!q;
  var list = AFFIXES.filter(function(a){ return (searching || a.kind === ui.notesKind) && affixMatches(a, q); });
  if(!list.length) return '<div class="empty"><p>No hay ningún afijo ni palabra que coincida con «' + esc(q) + '».</p></div>';
  var out = "";
  var pre = list.filter(function(a){ return a.kind === "pre"; });
  if(pre.length) out += (searching ? '<div class="section-h">Prefijos<small>' + pre.length + '</small></div>' : "") + '<div class="ac-grid">' + pre.map(affixCardHTML).join("") + '</div>';
  ["n","a","v","d"].forEach(function(c){
    var g = list.filter(function(a){ return a.kind === "suf" && a.cls === c; });

}

/* ================= PROGRESS ================= */
function screenProgress(){
  var seen = ITEMS.filter(function(it){ return statOf(it.id) && statOf(it.id).seen; }).length;
  var ok = 0, tot = 0; Object.keys(state.stats).forEach(function(k){ ok += state.stats[k].ok; tot += state.stats[k].seen; });
  var rows = AFFIXES.filter(function(a){ return a.items.length; }).map(function(a){
    var st = a.items.map(statOf), m = st.filter(isMastered).length, sn = st.filter(function(s){ return s && s.seen; }).length;
    var o = 0, t = 0; st.forEach(function(s){ if(s){ o += s.ok; t += s.seen; } });
    return {a:a, m:m, n:a.items.length, seen:sn, acc:t ? o / t : -1};
  });
  rows.sort(function(x, y){ return (x.m / x.n) - (y.m / y.n) || x.a.label.localeCompare(y.a.label); });
  function affRow(r){

    '<div class="stat"><span class="n">' + seen + '<small>/' + ITEMS.length + '</small></span><span class="l">vistos alguna vez</span></div>' +
    '<div class="stat"><span class="n">' + (tot ? pct(ok, tot) : 0) + '<small> %</small></span><span class="l">aciertos en total</span></div>' +
    '<div class="stat"><span class="n">' + state.bestRun + '</span><span class="l">récord de racha</span></div></div>';

  html += '<details class="aff-details"><summary>Ver el detalle por afijo</summary>' +
    '<div class="section-h">Prefijos<small>de menos a más dominado</small></div><div class="colbars prog">' + rows.filter(function(r){ return r.a.kind === "pre"; }).map(affRow).join("") + '</div>' +
    '<div class="section-h">Sufijos<small>de menos a más dominado</small></div><div class="colbars prog">' + rows.filter(function(r){ return r.a.kind === "suf"; }).map(affRow).join("") + '</div></details>';
  var worst = ITEMS.filter(function(it){ var s = statOf(it.id); return s && s.ko > 0; }).sort(function(a, b){ return statOf(b.id).ko - statOf(a.id).ko; }).slice(0, 8);
  if(worst.length){
    html += '<div class="section-h">Las que más fallas</div><div class="fail-list">' + worst.map(function(it){ return '<div class="fail-item"><span class="fi-base">' + esc(it.base) + '</span><span class="fi-arrow">→</span><b class="fi-ans">' + esc(it.ans) + '</b><span class="fi-yours">' + statOf(it.id).ko + ' ' + plural(statOf(it.id).ko, "fallo", "fallos") + '</span></div>'; }).join("") + '</div>';

  }
  html += '<div class="section-h">Ajustes</div><div class="box"><div class="h">Traducción en las pistas</div>' + segHTML("tr", [["auto","Solo cuando hace falta"],["always","Siempre"]], state.trMode) +
    '<p class="small dim">«Solo cuando hace falta» deja la clase de palabra como pista normal y añade la traducción donde la clase no basta (por ejemplo employee y employer).</p></div>';
  html += '<div class="section-h">Copia de seguridad</div>' +

    '<div class="box" id="exportBox" hidden></div><div class="box" id="importBox" hidden></div>' +
    '<button type="button" class="linkbtn faintlink" id="resetBtn"></button>';
  $screen.innerHTML = html;
  armConfirm($("#resetBtn"), "Restablecer progreso (tus trucos se conservan)", "¿Seguro? Toca otra vez para borrar estadísticas y medallas", function(){

  });
}
function exportCode(){
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }catch(e){ return ""; }
}
function importFromCode(code){
  try{
    var obj = JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g, "")))));
    if(!obj || typeof obj !== "object") return false;
    var inc = migrate(obj);
    Object.keys(state.tricks).forEach(function(id){ if(!inc.tricks[id]) inc.tricks[id] = state.tricks[id]; });
    state = inc; save(); return true;
  }catch(e){ return false; }
}

    else if(k === "tr"){ state.trMode = v; save(); }
    render(); return;
  }
  var el = e.target.closest("[data-act]"); if(!el) return;
  var act = el.dataset.act;
  if(act === "lv"){ ui.level = Number(el.dataset.lv); ui.screen = "intro"; ui.tab = "map"; render(); }
  else if(act === "to-map"){ go("map"); }
  else if(act === "start-level"){
    var L = LEVELS[Number(el.dataset.lv)];
    ui.tab = "map";
    startSession({kind:"level", title:"Nivel " + (L.i + 1), level:L.i, back:"map", items:shuffleArr(L.ids.map(function(id){ return ITEM[id]; }))});
  }
  else if(act === "start-smart"){
    ui.tab = "practice";
    startSession({kind:"smart", title:"Repaso", back:"practice", items:pickSmart(scopeItems(ui.cfg.scope), state.stats, ui.cfg.n, Date.now())});
  }
  else if(act === "start-fails"){
    ui.tab = "practice";
    startSession({kind:"fails", title:"Fallos", back:"practice", items:shuffleArr(failedItems(ui.cfg.scope).slice(0, ui.cfg.n))});
  }
  else if(act === "check" || act === "next"){ checkAnswer(); }
  else if(act === "reveal"){ if(ui.sess){ ui.sess.shown = true; var it = ui.sess.items[ui.sess.idx]; $("#chips").innerHTML = chipsHTML(it, false, true) + (trick(it.aff) ? '<button type="button" class="chip btnchip" data-act="truco">Mi truco</button>' : ""); var a = $("#ans"); if(a) a.focus(); } }
  else if(act === "truco"){ var ts = $("#trickShow"); if(ts) ts.hidden = !ts.hidden; var a2 = $("#ans"); if(a2) a2.focus(); }
  else if(act === "quit" || act === "back"){
    var to = ui.sess ? ui.sess.back : (ui.sum ? ui.sum.back : "map");
    ui.sess = null; ui.tab = to === "practice" ? "practice" : "map"; ui.screen = ui.tab; render();
  }
  else if(act === "redo"){
    var S = ui.sum;
    startSession({kind:"redo", title:"Repaso de fallos", back:S.back, level:null, items:shuffleArr(S.failed.map(function(r){ return ITEM[r.id]; }))});
  }
  else if(act === "start-exam"){ buildExam(); }
  else if(act === "exam-quit"){ ui.exam = null; go("exam"); }
  else if(act === "exam-new"){ ui.exam = null; go("exam"); }
  else if(act === "grade-exam"){ gradeExam(); }
  else if(act === "exam-redo"){
    var X = ui.exam, items = X.items.filter(function(it, i){ return !X.results[i].ok; });
    ui.tab = "exam"; startSession({kind:"redo", title:"Repaso del examen", back:"exam", items:shuffleArr(items)});
  }
  else if(act === "export"){
    var code = exportCode(), box = $("#exportBox");
    box.hidden = false; $("#importBox").hidden = true;
    box.innerHTML = '<div class="h">Tu código de progreso</div><textarea id="exportText" readonly></textarea><div class="small" id="exportMsg" style="min-height:16px"></div>';
    $("#exportText").value = code;
    copyText(code, function(ok){ $("#exportMsg").textContent = ok ? "Copiado. Pégalo en el otro dispositivo." : "Selecciona el texto y cópialo a mano."; if(!ok){ var t = $("#exportText"); t.focus(); t.select(); } });
  }
  else if(act === "import-open"){
    var ib = $("#importBox"); ib.hidden = false; $("#exportBox").hidden = true;
    ib.innerHTML = '<div class="h">Pega aquí el código</div><textarea id="importText" placeholder="Pega el código copiado en el otro dispositivo…"></textarea><button type="button" class="btn btn-ghost" data-act="import-go" style="align-self:flex-start">Restaurar progreso</button><div id="importMsg" class="small" style="min-height:16px"></div>';
  }
  else if(act === "import-go"){
    var txt = $("#importText").value, msg = $("#importMsg");
    if(!txt.trim()){ msg.textContent = "Pega antes un código."; return; }
    if(importFromCode(txt)){ msg.textContent = "Progreso restaurado."; setTimeout(function(){ render(); }, 600); }
    else msg.textContent = "Ese código no es válido. Cópialo entero otra vez.";
  }
}
function onKeydown(e){
  var t = e.target, isField = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
  if(t && t.id === "ans" && e.key === "Enter" && !e.isComposing){ e.preventDefault(); checkAnswer(); return; }
  if(t && t.classList && t.classList.contains("xin")){
    var i = Number(t.dataset.i), X = ui.exam;
    if(e.key === "Enter" && !e.isComposing){
      e.preventDefault();
      var nx = $("#xin-" + (i + 1)); if(nx) nx.focus(); else { var gb = $("#gradeBtn"); if(gb) gb.focus(); }
      return;
    }
    if((e.key === "Backspace") && t.value === "" && i > 0){
      e.preventDefault();
      var pv = $("#xin-" + (i - 1)); if(pv){ pv.focus(); try{ pv.setSelectionRange(pv.value.length, pv.value.length); }catch(err){} }
      return;
    }
  }
  if(e.key === "Escape"){
    if(ui.sess){ var to = ui.sess.back; ui.sess = null; ui.tab = to === "practice" ? "practice" : "map"; ui.screen = ui.tab; render(); }
    else if(ui.screen === "intro" || ui.screen === "summary"){ go("map"); }
    return;
  }
  if(isField || e.ctrlKey || e.metaKey || e.altKey) return;
  if(ui.screen === "quiz") return;
  var n = Number(e.key);
  if(n >= 1 && n <= TABS.length){ go(TABS[n - 1][0]); }
}
function onInput(e){
  var t = e.target;
  if(t.id === "notesQ"){
    ui.notesQ = t.value; $("#notesList").innerHTML = notesListHTML(); $$("textarea[data-trick]").forEach(autoGrow); return;
  }
  if(t.dataset && t.dataset.trick){ onTrickInput(t); return; }
  if(t.classList && t.classList.contains("xin")){
    var X = ui.exam; if(X){ X.answers[Number(t.dataset.i)] = t.value; var c = X.answers.filter(function(a){ return a.trim(); }).length; var xc = $("#xcount"); if(xc) xc.textContent = c + "/" + X.items.length; }
  }
}

function boot(){
  $screen = $("#screen");
  load();
  $("#muteBtn").addEventListener("click", function(){
    state.muted = !state.muted; save(); updateMuteBtn();
    if(!state.muted){ var c = ac(); if(c) tone(c, 700, c.currentTime, 0.07, {type:"square", vol:.1}); }
  });
  document.addEventListener("click", onClick);
  document.addEventListener("keydown", onKeydown);
  document.addEventListener("input", onInput);
  render();
}
boot();

})();
</script>
