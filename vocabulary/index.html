<style>

.go{font:700 20px/1 system-ui;padding:15px 44px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:62px 16px 60px}
header h1{margin:0;font-size:26px;letter-spacing:-.01em}header h1 small{display:block;font-size:13px;color:var(--ink2);font-weight:600}
.who{font-size:13.5px;color:var(--ink2);margin:4px 0 0}

.filt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.filt .lb{font:700 11.5px system-ui;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-right:2px}

form.add{display:grid;gap:10px}form.add label{display:grid;gap:4px;font:600 13px system-ui;color:var(--ink2)}
form.add input,form.add select,form.add textarea{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;font:500 15px system-ui;background:var(--paper);color:var(--ink)}

.lista-link{display:inline-block;margin-top:8px;font-weight:700;color:var(--acc);text-decoration:none}
</style></head><body>
<span class="claude" title="Desarrollado por Guillermo Bernabéu">Bernabéu</span>
<section id="start"><a href="../" class="vback1" style="position:fixed;top:56px;left:12px;color:var(--acc);font-weight:700;text-decoration:none">← Volver</a><h1>Vocabulary 1st Term</h1><p>Definición ↔ palabra · 1.º Bachillerato · lista compartida de la clase</p><button class="go" id="go">Empezar</button></section>
<div class="wrap" id="app" hidden>
<header><p style="margin:0 0 6px"><a href="../" class="vback1" style="color:var(--acc);font-weight:700;text-decoration:none">← Volver</a></p><h1><small>Inglés · 1.º Bachillerato</small>Vocabulary 1st Term</h1><p class="who" id="who">Conectando…</p><a class="lista-link" href="lista.html">📄 Ver la lista completa</a><button class="btn sec" id="gbtn" hidden style="margin-top:8px;height:38px">Entrar con Google</button></header>

</div>
<script src="palabras.js?v=1794514981"></script><script src="plurales.js?v=1794514981"></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const BLOQUES=["Textos","Weather","Idioms","Plurales irregulares","Otras"];
const S={tab:"dw",blq:new Set(["Textos","Weather","Idioms","Plurales irregulares","Otras"]),soloF:false,soloO:false,words:[],q:null,done:false,ok:0,ko:0,ra:0,me:null,owner:false,db:null,user:null,names:{},users:{},nombre:""};
// progreso por palabra: a = aciertos, f = fallos, r = aciertos seguidos
let ST={};try{ST=JSON.parse(localStorage.getItem("vocabStats")||"{}")||{}}catch(e){}
try{for(const id of JSON.parse(localStorage.getItem("vocabOk")||"[]"))if(!ST[id])ST[id]={a:1,f:0,r:1}}catch(e){}
const saveST=()=>{try{localStorage.setItem("vocabStats",JSON.stringify(ST))}catch(e){}};
const DOM=3; // aciertos seguidos para darla por dominada
function nivel(id){const t=ST[id];if(!t||!t.a)return "nada";return t.r>=DOM?"dom":"ctrl"}
function cuenta(){const c={dom:0,ctrl:0,nada:0};for(const w of S.words)c[nivel(w.id)]++;return c}
function puntosVocab(c){c=c||cuenta();const n=S.words.length||1;return Math.round(100*(c.dom+c.ctrl*0.5)/n)}
const NIV={dom:["✅","Dominadas","Las has acertado "+DOM+" veces seguidas"],ctrl:["🟡","Controlando","Ya las has acertado alguna vez"],nada:["⭕","Sin saber","Todavía no las has acertado"]};
let ptsAntes=null;
function dominio(){const d=$("#dominio");if(!d)return;const c=cuenta(),n=S.words.length||1,p=puntosVocab(c);
 const sube=ptsAntes!=null&&p>ptsAntes?p-ptsAntes:0;ptsAntes=p;
 d.innerHTML=`<div class="pts-v" title="Tus puntos de Vocabulary para el ranking (máximo 100)"><b>${p}</b><span>pts</span>${sube?`<em class="sube">+${sube}</em>`:""}</div>
  <div class="niv">${["dom","ctrl","nada"].map(k=>`<button class="nv nv-${k}" data-niv="${k}" aria-pressed="${S.nivel===k}" title="${NIV[k][2]}. Toca para practicar solo estas."><span>${NIV[k][0]} ${NIV[k][1]}</span><b>${c[k]}</b></button>`).join("")}</div>
  <div class="barra-v" aria-hidden="true"><i class="b-dom" style="width:${c.dom/n*100}%"></i><i class="b-ctrl" style="width:${c.ctrl/n*100}%"></i></div>`;
 d.querySelectorAll("[data-niv]").forEach(b=>b.onclick=()=>{S.nivel=S.nivel===b.dataset.niv?null:b.dataset.niv;nueva()})}
let FALLOS=[];try{FALLOS=JSON.parse(localStorage.getItem("vocabFallos")||"[]")}catch(e){}
const saveF=()=>{try{localStorage.setItem("vocabFallos",JSON.stringify(FALLOS))}catch(e){}};
// ---------- filtros ----------
const filt=$("#filt");
for(const b of BLOQUES){const c=el("button","chip",b);c.setAttribute("aria-pressed","true");c.onclick=()=>{S.blq.has(b)?S.blq.delete(b):S.blq.add(b);c.setAttribute("aria-pressed",String(S.blq.has(b)));nueva()};filt.append(c)}
$("#rondaB").onclick=function(){if(S.ronda){S.ronda=null;this.setAttribute("aria-pressed","false");nueva();return}empezarRonda(mezcla(S.words.map(w=>w.id)).slice(0,20),"ronda")};
$("#fallosB").onclick=function(){S.soloF=!S.soloF;this.setAttribute("aria-pressed",String(S.soloF));nueva()};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));nueva()});
function pool(){let p=S.words.filter(w=>S.blq.has(BLOQUES.includes(w.bloque)?w.bloque:"Otras"));if(S.soloF)p=p.filter(w=>FALLOS.includes(w.id));if(S.nivel)p=p.filter(w=>nivel(w.id)===S.nivel);return p}
function stats(){dominio();const s=$("#stats");s.textContent="";const add=(l,v)=>{const sp=el("span");sp.append(l+" ");const b=el("b",null,String(v));sp.append(b);s.append(sp)};
 add("Palabras",pool().length);add("Aciertos",S.ok);add("Fallos",S.ko);add("Racha",S.ra);add("Fallos guardados",FALLOS.length)}
// ---------- comprobación ----------
const sinT=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const norm=s=>sinT(String(s).toLowerCase()).replace(/[’´`]/g,"'").replace(/[.,!?¡¿;:()…]/g," ").replace(/\s+/g," ").trim().replace(/^to /,"").replace(/^(a|an|the) (?=\S)/,"");
function variantes(en){const out=new Set();const base=String(en);
 for(const part of base.split(/\s*[\/=]\s*/)){out.add(norm(part));out.add(norm(part.replace(/\(s\)/,"")));out.add(norm(part.replace(/\(s\)/,"s")))}
 out.add(norm(base));return [...out].filter(Boolean)}
// 2 = bien (la de la lista o un sinónimo que vale), 1 = casi (una letra), 0 = mal. S.altUsada = sinónimo aceptado
function corrige(ans,w){S.altUsada=null;const a=norm(ans);if(!a)return 0;if(variantes(w.en).includes(a))return 2;
 const alts=(w.ok||[]).filter(x=>norm(x)===a||variantes(x).includes(a));if(alts.length){S.altUsada=alts[0];return 2}
 // un despiste de una letra
 for(const v of [...variantes(w.en),...(w.ok||[]).flatMap(variantes)]){if(Math.abs(v.length-a.length)<=1&&lev(v,a)<=1&&v.length>4)return 1}return 0}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function apunta(w,bien){if(S.ronda&&S.ronda.ids[S.ronda.i]===w.id&&!S.ronda.hecha){S.ronda.hecha=true;(bien?S.ronda.ok:S.ronda.ko).push(w.id)}const antes=nivel(w.id),t=ST[w.id]=ST[w.id]||{a:0,f:0,r:0};if(bien){t.a++;t.r++}else{t.f++;t.r=0}saveST();S.cambio=antes!==nivel(w.id)?nivel(w.id):null;if(bien){S.ok++;S.ra++;FALLOS=FALLOS.filter(x=>x!==w.id)}else{S.ko++;S.ra=0;if(!FALLOS.includes(w.id))FALLOS.push(w.id)}saveF();stats();window.trasApuntar&&window.trasApuntar(w,bien)}
// ---------- vistas ----------
const main=$("#main");

// ---------- Plurales irregulares: singular ↔ plural, con traducción ----------
let PST={};try{PST=JSON.parse(localStorage.getItem("pluralStats")||"{}")||{}}catch(e){}
const savePST=()=>{try{localStorage.setItem("pluralStats",JSON.stringify(PST))}catch(e){}};
const PDOM=2;
const pid=p=>"pl:"+p[0];
function pnivel(p){const t=PST[pid(p)];if(!t||!t.a)return "nada";return t.r>=PDOM?"dom":"ctrl"}
function pcuenta(){const c={dom:0,ctrl:0,nada:0};for(const p of PLURALES)c[pnivel(p)]++;return c}
window.pcuenta=pcuenta;
S.pdir=S.pdir||"mix";let PREC=[];
function ppick(){let L=PLURALES.slice();const nd=L.filter(p=>pnivel(p)!=="dom");if(nd.length)L=nd;
 const w=L.map(p=>{const t=PST[pid(p)];let k=!t||!(t.a+t.f)?6:!t.a?9:t.r===0?8:3;const i=PREC.indexOf(p[0]);if(i>=0)k*=0.02*(i+1);return k});
 let x=Math.random()*w.reduce((a,b)=>a+b,0),r=L[L.length-1];for(let i=0;i<L.length;i++){x-=w[i];if(x<=0){r=L[i];break}}
 PREC.unshift(r[0]);PREC.length=Math.min(PREC.length,10);return r}
function plurales(){const c0=pcuenta(),n=PLURALES.length;
 const cab=el("div","card pl-cab");cab.innerHTML=`<div class="pl-st"><span>✅ <b>${c0.dom}</b> dominados</span><span>🟡 <b>${c0.ctrl}</b> controlando</span><span>⭕ <b>${c0.nada}</b> sin saber</span><span class="pl-pts"><b>${Math.round(100*(c0.dom+c0.ctrl*0.5)/n)}</b> pts</span></div><div class="pl-dir">${[["sp","Singular → plural"],["ps","Plural → singular"],["mix","Mezcla"]].map(([k,t])=>`<button class="chip" data-pdir="${k}" aria-pressed="${S.pdir===k}">${t}</button>`).join("")}</div>`;
 main.append(cab);cab.querySelectorAll("[data-pdir]").forEach(b=>b.onclick=()=>{S.pdir=b.dataset.pdir;nueva()});
